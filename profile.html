<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Profile — Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 8px;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] min-h-screen flex">
    <!-- Sidebar Container -->
    <aside
      id="sidebarContainer"
      class="hidden md:flex flex-col shrink-0 h-screen sticky top-0"
    ></aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">
    <!-- Mobile burger button (shown only on mobile) -->
    <div class="md:hidden sticky top-0 z-30 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center gap-3 shadow-sm">
      <button
        onclick="if(typeof openMobileSidebar==='function')openMobileSidebar();"
        class="p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[#0F172A] hover:bg-slate-100 transition-colors flex-shrink-0"
        aria-label="Open menu"
      >
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-[#0F172A] text-base tracking-tight" style="font-family:'Urbanist',sans-serif;">MyPortal</span>
    </div>
      <div class="p-6 md:p-10">
      <div class="max-w-xl mx-auto space-y-6">
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
            Account Profile
          </h1>
          <p class="text-sm text-[#64748B] mt-1">
            Update your personal details and security settings
          </p>
        </div>

        <!-- Success/Error Message Container -->
        <div
          id="alertMessage"
          class="hidden p-4 rounded-xl text-xs font-medium"
        ></div>

        <!-- Profile Form Card -->
        <div
          class="bg-white border border-[#E2E8F0] rounded-2xl p-6 md:p-8 shadow-sm space-y-5"
        >
          <form id="profileForm" class="space-y-5">
            <div class="space-y-1.5">
              <label
                class="block text-[11px] font-bold uppercase tracking-wider text-[#64748B]"
              >
                Full Name
              </label>
              <input
                type="text"
                id="fullNameInput"
                required
                class="w-full px-4 py-2.5 bg-white border border-[#E2E8F0] rounded-xl text-sm text-[#0F172A] focus:outline-none focus:border-[#0D9488] focus:ring-1 focus:ring-[#0D9488] transition-all"
              />
            </div>

            <div class="space-y-1.5">
              <label
                class="block text-[11px] font-bold uppercase tracking-wider text-[#64748B]"
              >
                School Name
                <span class="font-normal lowercase">(cannot be changed)</span>
              </label>
              <input
                type="text"
                id="schoolNameInput"
                disabled
                class="w-full px-4 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm text-[#64748B] cursor-not-allowed select-none"
              />
            </div>

            <div class="space-y-1.5">
              <label
                class="block text-[11px] font-bold uppercase tracking-wider text-[#64748B]"
              >
                Current Password
                <span class="font-normal lowercase"
                  >(required to make changes)</span
                >
              </label>
              <input
                type="password"
                id="currentPasswordInput"
                required
                placeholder="••••••••"
                class="w-full px-4 py-2.5 bg-white border border-[#E2E8F0] rounded-xl text-sm text-[#0F172A] focus:outline-none focus:border-[#0D9488] focus:ring-1 focus:ring-[#0D9488] transition-all"
              />
            </div>

            <div class="space-y-1.5">
              <label
                class="block text-[11px] font-bold uppercase tracking-wider text-[#64748B]"
              >
                New Password
                <span class="font-normal lowercase"
                  >(leave blank to keep current)</span
                >
              </label>
              <input
                type="password"
                id="newPasswordInput"
                placeholder="••••••••"
                class="w-full px-4 py-2.5 bg-white border border-[#E2E8F0] rounded-xl text-sm text-[#0F172A] focus:outline-none focus:border-[#0D9488] focus:ring-1 focus:ring-[#0D9488] transition-all"
              />
            </div>

            <button
              type="submit"
              id="saveButton"
              class="w-full py-3 bg-[#0D9488] hover:bg-[#0B7C72] text-white font-bold rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 text-sm mt-2"
            >
              Save Changes
            </button>
          </form>
        </div>
      </div>
      </div>
    </main>

    <script>
      /* ===================== AUTH + SIDEBAR ===================== */
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.full_name) {
        window.location.href = "index.html";
      } else {
        document.getElementById("fullNameInput").value = user.full_name || "";
        document.getElementById("schoolNameInput").value =
          user.school_name || "admin";
      }

      fetch("sidebar.html")
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById("sidebarContainer");
          container.innerHTML = html;
          const scripts = container.querySelectorAll("script");
          scripts.forEach((script) => {
            const newScript = document.createElement("script");
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
          if (typeof renderSidebar === "function") {
            renderSidebar("Profile");
          }
        });

      /* ===================== PROFILE FORM SUBMISSION ===================== */
      document
        .getElementById("profileForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const alertBox = document.getElementById("alertMessage");
          const saveBtn = document.getElementById("saveButton");

          const full_name = document
            .getElementById("fullNameInput")
            .value.trim();
          const current_password = document.getElementById(
            "currentPasswordInput",
          ).value;
          const new_password =
            document.getElementById("newPasswordInput").value;

          alertBox.className = "hidden";
          saveBtn.disabled = true;
          saveBtn.innerText = "Saving Changes...";

          try {
            const res = await fetch("/api/update-profile", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                user_id: user.id,
                full_name,
                current_password,
                new_password: new_password ? new_password : undefined,
              }),
            });

            const rawText = await res.text();
            let data;
            try {
              data = JSON.parse(rawText);
            } catch (err) {
              throw new Error(
                `Server returned non-JSON response: "${rawText.substring(0, 80)}..."`,
              );
            }

            if (!res.ok)
              throw new Error(data.error || "Failed to update profile");

            // Update local storage cache
            user.full_name = full_name;
            localStorage.setItem("user", JSON.stringify(user));

            alertBox.className =
              "p-4 rounded-xl text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200";
            alertBox.innerText = "Profile successfully updated!";
            document.getElementById("currentPasswordInput").value = "";
            document.getElementById("newPasswordInput").value = "";
          } catch (err) {
            console.error(err);
            alertBox.className =
              "p-4 rounded-xl text-xs font-medium bg-rose-50 text-rose-800 border border-rose-200";
            alertBox.innerText =
              err.message || "An error occurred while updating profile.";
          } finally {
            saveBtn.disabled = false;
            saveBtn.innerText = "Save Changes";
          }
        });
    </script>
  </body>
</html>
