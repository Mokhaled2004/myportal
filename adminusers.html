<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users — Portal Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex">
    <!-- Sidebar Container -->
    <aside
      id="sidebarContainer"
      class="hidden md:flex flex-col shrink-0 h-screen sticky top-0"
    ></aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">    <!-- Mobile burger button (shown only on mobile) -->
    <div class="md:hidden sticky top-0 z-30 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center gap-3 shadow-sm">
      <button
        onclick="if(typeof openMobileSidebar==='function')openMobileSidebar();"
        class="p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[#0F172A] hover:bg-slate-100 transition-colors flex-shrink-0"
        aria-label="Open menu"
      >
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-[#0F172A] text-base tracking-tight" style="font-family:'Urbanist',sans-serif;">MyPortal</span>
    </div>      <div class="p-6 md:p-10">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
          Manage Users
        </h1>
        <span
          id="welcomeUser"
          class="text-sm font-medium text-[#64748B]"
        ></span>
      </div>

      <!-- Users Table Card -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl shadow-sm overflow-hidden"
      >
        <table class="w-full text-left border-collapse">
          <thead>
            <tr
              class="bg-[#F8FAFC] border-b border-[#E2E8F0] text-xs font-bold text-[#64748B] uppercase tracking-wider"
            >
              <th class="py-4 px-6">Full Name</th>
              <th class="py-4 px-6">School Name</th>
              <th class="py-4 px-6">Role / Status</th>
            </tr>
          </thead>
          <tbody id="usersTableBody" class="divide-y divide-[#E2E8F0] text-sm">
            <!-- Populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
    </main>

    <!-- Unauthorized Access Modal / Overlay -->
    <div
      id="unauthorizedModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-xl text-center border border-[#E2E8F0]"
      >
        <div
          class="w-12 h-12 bg-[#FEF2F2] text-[#B91C1C] rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-xl"
        >
          !
        </div>
        <h2 class="text-lg font-bold text-[#0F172A] mb-2">
          Unauthorized Access
        </h2>
        <p class="text-sm text-[#64748B] mb-6">
          You do not have administrative privileges to view this page.
        </p>
        <button
          onclick="window.location.href = 'dashboard.html'"
          class="w-full py-2.5 bg-[#0F172A] hover:bg-slate-800 text-white font-semibold rounded-xl text-sm transition-colors"
        >
          Go to User Dashboard
        </button>
      </div>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.full_name) {
        window.location.href = "index.html";
      } else if (!user.is_admin) {
        document.getElementById("unauthorizedModal").classList.remove("hidden");
        document.getElementById("unauthorizedModal").classList.add("flex");
      } else {
        document.getElementById("welcomeUser").textContent =
          `Logged in as: ${user.full_name}`;
        fetchUsers();
      }

      function logout() {
        localStorage.removeItem("user");
        window.location.href = "index.html";
      }

      // Load Admin Sidebar component dynamically
      fetch("adminsidebar.html")
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById("sidebarContainer");
          container.innerHTML = html;

          const scripts = container.querySelectorAll("script");
          scripts.forEach((script) => {
            const newScript = document.createElement("script");
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });

          if (typeof renderSidebar === "function") {
            renderSidebar("Manage Users");
          }
        });

      async function fetchUsers() {
        const tbody = document.getElementById("usersTableBody");

        // Show loading spinner inside the table while fetching
        tbody.innerHTML = `
          <tr>
            <td colspan="3" class="py-12 text-center">
              <div class="flex flex-col items-center justify-center gap-3">
                <div class="w-8 h-8 border-4 border-[#0D9488] border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-medium text-[#64748B]">Loading users...</p>
              </div>
            </td>
          </tr>
        `;

        try {
          const res = await fetch("/api/users");
          const users = await res.json();
          tbody.innerHTML = "";

          // Filter out the currently logged in user based on full_name
          const filteredUsers = users.filter(
            (u) => u.full_name !== user.full_name,
          );

          if (filteredUsers.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="3" class="p-8 text-center text-[#64748B]">No other registered users found.</td>
              </tr>
            `;
            return;
          }

          filteredUsers.forEach((u) => {
            let roleBadge =
              '<span class="px-2.5 py-1 text-xs font-semibold bg-slate-100 text-[#64748B] rounded-full">Student</span>';
            if (u.is_admin)
              roleBadge =
                '<span class="px-2.5 py-1 text-xs font-semibold bg-[#FEF2F2] text-[#B91C1C] rounded-full">Admin</span>';
            else if (u.is_assistant)
              roleBadge =
                '<span class="px-2.5 py-1 text-xs font-semibold bg-[#ECFDF5] text-[#047857] rounded-full">Assistant</span>';

            tbody.innerHTML += `
              <tr class="hover:bg-slate-50/80 transition-colors">
                <td class="py-4 px-6 font-semibold text-[#0F172A]">${u.full_name}</td>
                <td class="py-4 px-6 text-[#64748B]">${u.school_name || "—"}</td>
                <td class="py-4 px-6">${roleBadge}</td>
              </tr>
            `;
          });
        } catch (err) {
          console.error("Failed to load users", err);
          tbody.innerHTML = `
            <tr>
              <td colspan="3" class="p-8 text-center text-[#B91C1C]">Failed to load users. Please try again later.</td>
            </tr>
          `;
        }
      }
    </script>
  </body>
</html>
