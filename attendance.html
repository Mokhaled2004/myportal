<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Attendance — Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex">
    <!-- Sidebar Container -->
    <aside
      id="sidebarContainer"
      class="hidden md:flex flex-col shrink-0 h-screen sticky top-0"
    ></aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">    <!-- Mobile burger button (shown only on mobile) -->
    <div class="md:hidden sticky top-0 z-30 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center gap-3 shadow-sm">
      <button
        onclick="if(typeof openMobileSidebar==='function')openMobileSidebar();"
        class="p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[#0F172A] hover:bg-slate-100 transition-colors flex-shrink-0"
        aria-label="Open menu"
      >
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-[#0F172A] text-base tracking-tight" style="font-family:'Urbanist',sans-serif;">MyPortal</span>
    </div>      <div class="p-6 md:p-10">
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8"
      >
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
            My Attendance
          </h1>
          <p class="text-sm text-[#64748B]">
            Track your daily session attendance history, punctuality, and
            overall attendance rate.
          </p>
        </div>
      </div>

      <!-- Attendance Summary Cards Banner -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
        <div
          class="bg-white border border-[#E2E8F0] rounded-2xl p-5 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 rounded-2xl bg-teal-50 text-[#0D9488] flex items-center justify-center flex-shrink-0 font-bold"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
          </div>
          <div>
            <span
              class="block text-xs uppercase tracking-wider font-bold text-[#64748B]"
              >Attendance Rate</span
            >
            <span id="statRate" class="text-2xl font-bold text-[#0F172A]"
              >0%</span
            >
          </div>
        </div>

        <div
          class="bg-white border border-[#E2E8F0] rounded-2xl p-5 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center flex-shrink-0 font-bold"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </div>
          <div>
            <span
              class="block text-xs uppercase tracking-wider font-bold text-[#64748B]"
              >Present</span
            >
            <span id="statPresent" class="text-2xl font-bold text-[#0F172A]"
              >0</span
            >
          </div>
        </div>

        <div
          class="bg-white border border-[#E2E8F0] rounded-2xl p-5 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center flex-shrink-0 font-bold"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          </div>
          <div>
            <span
              class="block text-xs uppercase tracking-wider font-bold text-[#64748B]"
              >Late</span
            >
            <span id="statLate" class="text-2xl font-bold text-[#0F172A]"
              >0</span
            >
          </div>
        </div>

        <div
          class="bg-white border border-[#E2E8F0] rounded-2xl p-5 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center flex-shrink-0 font-bold"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </div>
          <div>
            <span
              class="block text-xs uppercase tracking-wider font-bold text-[#64748B]"
              >Absent</span
            >
            <span id="statAbsent" class="text-2xl font-bold text-[#0F172A]"
              >0</span
            >
          </div>
        </div>
      </div>

      <!-- Filters and Search Bar -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl p-4 sm:p-6 shadow-sm mb-8 flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <div class="relative w-full md:w-96">
          <svg
            class="absolute left-3.5 top-3.5 w-4 h-4 text-[#64748B]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            type="text"
            id="searchInput"
            oninput="filterAttendance()"
            placeholder="Search by session title or remark..."
            class="w-full pl-10 pr-4 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488] text-[#0F172A]"
          />
        </div>
        <div
          class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end"
        >
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label
              class="text-xs font-semibold text-[#64748B] uppercase tracking-wider"
              >Status:</label
            >
            <div class="relative flex-1 sm:flex-none">
              <select
                id="statusSelect"
                onchange="filterAttendance()"
                class="w-full appearance-none pl-3 pr-9 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm font-medium text-[#0F172A] focus:outline-none focus:border-[#0D9488] hover:border-[#0D9488] transition-colors cursor-pointer"
              >
                <option value="all">All Statuses</option>
                <option value="present">Present</option>
                <option value="late">Late</option>
                <option value="absent">Absent</option>
                <option value="excused">Excused</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-[#64748B]"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label
              class="text-xs font-semibold text-[#64748B] uppercase tracking-wider"
              >Sort:</label
            >
            <div class="relative flex-1 sm:flex-none">
              <select
                id="sortSelect"
                onchange="filterAttendance()"
                class="w-full appearance-none pl-3 pr-9 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm font-medium text-[#0F172A] focus:outline-none focus:border-[#0D9488] hover:border-[#0D9488] transition-colors cursor-pointer"
              >
                <option value="date-new">Date: Newest First</option>
                <option value="date-old">Date: Oldest First</option>
                <option value="title">Title (A-Z)</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-[#64748B]"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Attendance Records Container -->
      <div id="attendanceContainer" class="space-y-4">
        <!-- Populated dynamically -->
      </div>
    </div>
    </main>

    <script>
      let allAttendance = [];

      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.full_name) {
        window.location.href = "index.html";
      } else {
        init();
      }

      // Load Sidebar component dynamically and initialize active state
      fetch("sidebar.html")
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById("sidebarContainer");
          container.innerHTML = html;
          const scripts = container.querySelectorAll("script");
          scripts.forEach((script) => {
            const newScript = document.createElement("script");
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
          if (typeof renderSidebar === "function") {
            renderSidebar("Attendance");
          }
        });

      async function init() {
        const container = document.getElementById("attendanceContainer");
        container.innerHTML = `
          <div class="py-20 flex flex-col items-center justify-center gap-3">
            <div class="w-8 h-8 border-4 border-[#0D9488] border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-medium text-[#64748B]">Loading attendance records...</p>
          </div>
        `;

        try {
          const res = await fetch(`/api/attendance?studentId=${user.id}`);
          if (!res.ok) throw new Error("Failed to fetch");
          const data = await res.json();
          // Support both array response or object with attendance property
          allAttendance = Array.isArray(data) ? data : data.attendance || [];

          updateStats();
          filterAttendance();
        } catch (err) {
          console.error("Failed to load attendance", err);
          // Fallback demo data if API endpoint fails
          allAttendance = [
            {
              id: 1,
              title: "Chapter 1: Atomic Structure Lecture",
              date: "2026-09-10",
              time: "10:00 AM",
              status: "present",
              remarks: "Joined on time",
            },
            {
              id: 2,
              title: "Chapter 2: Bonding & Structure Quiz Session",
              date: "2026-09-08",
              time: "02:00 PM",
              status: "present",
              remarks: "Active participation",
            },
            {
              id: 3,
              title: "Chapter 3: Energetics Review",
              date: "2026-09-05",
              time: "11:30 AM",
              status: "late",
              remarks: "Joined 15 minutes late",
            },
            {
              id: 4,
              title: "Past Paper Solving Masterclass",
              date: "2026-09-01",
              time: "04:00 PM",
              status: "absent",
              remarks: "Unexcused absence",
            },
            {
              id: 5,
              title: "Organic Chemistry Intro",
              date: "2026-08-28",
              time: "10:00 AM",
              status: "excused",
              remarks: "Medical excuse submitted",
            },
          ];
          updateStats();
          filterAttendance();
        }
      }

      function updateStats() {
        const total = allAttendance.length;
        if (total === 0) {
          document.getElementById("statRate").textContent = "0%";
          document.getElementById("statPresent").textContent = "0";
          document.getElementById("statLate").textContent = "0";
          document.getElementById("statAbsent").textContent = "0";
          return;
        }

        const presentCount = allAttendance.filter(
          (a) => a.status === "present",
        ).length;
        const lateCount = allAttendance.filter(
          (a) => a.status === "late",
        ).length;
        const absentCount = allAttendance.filter(
          (a) => a.status === "absent",
        ).length;

        const rate = Math.round(((presentCount + lateCount) / total) * 100);

        document.getElementById("statRate").textContent = `${rate}%`;
        document.getElementById("statPresent").textContent = presentCount;
        document.getElementById("statLate").textContent = lateCount;
        document.getElementById("statAbsent").textContent = absentCount;
      }

      function filterAttendance() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const statusFilter = document.getElementById("statusSelect").value;
        const sortBy = document.getElementById("sortSelect").value;

        let filtered = allAttendance.filter((item) => {
          const matchesQuery =
            item.title.toLowerCase().includes(query) ||
            (item.remarks && item.remarks.toLowerCase().includes(query));
          const matchesStatus =
            statusFilter === "all" || item.status === statusFilter;
          return matchesQuery && matchesStatus;
        });

        filtered.sort((a, b) => {
          const dateA = new Date(a.date).getTime();
          const dateB = new Date(b.date).getTime();

          if (sortBy === "date-new") {
            return dateB - dateA;
          } else if (sortBy === "date-old") {
            return dateA - dateB;
          } else if (sortBy === "title") {
            return a.title.localeCompare(b.title);
          }
        });

        renderAttendanceList(filtered);
      }

      function renderAttendanceList(items) {
        const container = document.getElementById("attendanceContainer");
        container.innerHTML = "";

        if (items.length === 0) {
          container.innerHTML = `
            <div class="bg-white border border-[#E2E8F0] rounded-2xl p-12 text-center shadow-sm">
              <p class="text-sm font-medium text-[#64748B]">No attendance records found matching your criteria.</p>
            </div>
          `;
          return;
        }

        let html = `<div class="bg-white border border-[#E2E8F0] rounded-2xl shadow-sm overflow-hidden divide-y divide-[#E2E8F0]">`;

        items.forEach((item) => {
          let badgeColor = "bg-slate-100 text-slate-700 border-slate-200";
          let statusText = "Unknown";
          let statusIcon = "";

          if (item.status === "present") {
            badgeColor = "bg-emerald-50 text-emerald-700 border-emerald-200";
            statusText = "Present";
            statusIcon = `<svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
          } else if (item.status === "late") {
            badgeColor = "bg-amber-50 text-amber-700 border-amber-200";
            statusText = "Late";
            statusIcon = `<svg class="w-4 h-4 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
          } else if (item.status === "absent") {
            badgeColor = "bg-red-50 text-red-700 border-red-200";
            statusText = "Absent";
            statusIcon = `<svg class="w-4 h-4 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>`;
          } else if (item.status === "excused") {
            badgeColor = "bg-blue-50 text-blue-700 border-blue-200";
            statusText = "Excused";
            statusIcon = `<svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
          }

          let formattedDate = item.date;
          try {
            formattedDate = new Date(item.date).toLocaleDateString("en-US", {
              month: "short",
              day: "numeric",
              year: "numeric",
            });
          } catch (e) {}

          html += `
            <div class="p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 hover:bg-[#F8FAFC]/50 transition-colors">
              <div class="flex items-start gap-4">
                <div class="w-10 h-10 rounded-xl bg-[#0D9488]/10 text-[#0D9488] flex items-center justify-center flex-shrink-0 mt-0.5">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                </div>
                <div>
                  <h3 class="font-bold text-[#0F172A] text-base">${item.title}</h3>
                  <div class="flex flex-wrap items-center gap-2 text-xs text-[#64748B] mt-1">
                    <span>${formattedDate}</span>
                    ${item.time ? `<span>•</span><span>${item.time}</span>` : ""}
                    ${item.remarks ? `<span>•</span><span class="italic text-[#0F172A]">${item.remarks}</span>` : ""}
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-3 self-end sm:self-center">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold border ${badgeColor}">
                  ${statusIcon}
                  <span>${statusText}</span>
                </span>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        container.innerHTML = html;
      }
    </script>
  </body>
</html>
