<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastpaper Submissions — Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex">
    <!-- Sidebar Container -->
    <aside
      id="sidebarContainer"
      class="hidden md:flex flex-col shrink-0 h-screen sticky top-0"
    ></aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">    <!-- Mobile burger button (shown only on mobile) -->
    <div class="md:hidden sticky top-0 z-30 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center gap-3 shadow-sm">
      <button
        onclick="if(typeof openMobileSidebar==='function')openMobileSidebar();"
        class="p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[#0F172A] hover:bg-slate-100 transition-colors flex-shrink-0"
        aria-label="Open menu"
      >
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-[#0F172A] text-base tracking-tight" style="font-family:'Urbanist',sans-serif;">MyPortal</span>
    </div>      <div class="p-6 md:p-10">
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
      >
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
            Pastpaper Submissions & Deadlines
          </h1>
          <p class="text-sm text-[#64748B]">
            Manage pastpaper availability, set submission deadlines, and review
            student submission statuses.
          </p>
        </div>
      </div>

      <!-- Search & Filters Bar -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl p-4 sm:p-6 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <div class="relative w-full md:w-96">
          <svg
            class="absolute left-3.5 top-3.5 w-4 h-4 text-[#64748B]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            type="text"
            id="searchInput"
            oninput="filterPastpapers()"
            placeholder="Search pastpapers by title, month, or year..."
            class="w-full pl-10 pr-4 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488] text-[#0F172A]"
          />
        </div>
      </div>

      <!-- Pastpapers List Container -->
      <div id="pastpapersContainer" class="space-y-4">
        <!-- Populated dynamically by JS -->
      </div>
    </div>
    </main>

    <script>
      let allPastpapers = [];

      // Check authentication
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.full_name) {
        window.location.href = "index.html";
      } else {
        init();
      }

      // Load Sidebar component dynamically
      fetch("adminsidebar.html")
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById("sidebarContainer");
          container.innerHTML = html;
          const scripts = container.querySelectorAll("script");
          scripts.forEach((script) => {
            const newScript = document.createElement("script");
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
          if (typeof renderSidebar === "function") {
            renderSidebar("Pastpapers Submissions");
          }
        });

      async function init() {
        await fetchPastpapers();
      }

      async function fetchPastpapers() {
        const container = document.getElementById("pastpapersContainer");
        container.innerHTML = `
          <div class="py-20 flex flex-col items-center justify-center gap-3">
            <div class="w-8 h-8 border-4 border-[#0D9488] border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-medium text-[#64748B]">Loading pastpapers...</p>
          </div>
        `;

        try {
          const res = await fetch("/api/pastpaper-submissions");
          allPastpapers = await res.json();
          filterPastpapers();
        } catch (err) {
          console.error("Failed to load pastpapers", err);
          container.innerHTML = `
            <div class="p-12 text-center bg-white border border-[#E2E8F0] rounded-2xl text-[#B91C1C]">
              Failed to load pastpapers. Please refresh the page.
            </div>
          `;
        }
      }

      function filterPastpapers() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        let filtered = allPastpapers.filter((item) => {
          return (
            (item.title && item.title.toLowerCase().includes(query)) ||
            (item.month && item.month.toLowerCase().includes(query)) ||
            (item.year && item.year.toString().includes(query))
          );
        });

        renderPastpapers(filtered);
      }

      function getRowClasses(status) {
        if (status === "submitted") {
          return "bg-emerald-50/80 hover:bg-emerald-100/80";
        } else {
          return "bg-rose-50/80 hover:bg-rose-100/80";
        }
      }

      function getStatusClasses(status) {
        if (status === "submitted") {
          return "bg-emerald-100 text-emerald-800 border-emerald-300";
        } else {
          return "bg-rose-100 text-rose-800 border-rose-300";
        }
      }

      function renderPastpapers(items) {
        const container = document.getElementById("pastpapersContainer");

        if (!items || items.length === 0) {
          container.innerHTML = `
            <div class="bg-white border border-[#E2E8F0] rounded-2xl p-12 text-center shadow-sm">
              <p class="text-sm font-medium text-[#64748B]">No pastpapers found.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = items
          .map((item) => {
            const formattedDeadline = item.deadline
              ? new Date(item.deadline).toISOString().slice(0, 16)
              : "";

            return `
            <div class="bg-white border border-[#E2E8F0] rounded-2xl p-6 shadow-sm transition-all space-y-4">
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                  <div class="w-10 h-10 rounded-xl bg-teal-50 text-[#0D9488] flex items-center justify-center shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                  </div>
                  <div>
                    <h3 class="text-base font-bold text-[#0F172A]">${item.title}</h3>
                    <div class="flex items-center gap-2 mt-1 text-xs text-[#64748B]">
                      <span>Month: ${item.month}</span>
                      <span>•</span>
                      <span>Year: ${item.year}</span>
                    </div>
                  </div>
                </div>

                <!-- Controls: Active Checkbox & Deadline Input -->
                <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto justify-end">
                  <label class="flex items-center gap-2 cursor-pointer bg-[#F8FAFC] border border-[#E2E8F0] px-3 py-2 rounded-xl text-xs font-semibold">
                    <input type="checkbox" id="active_${item.id}" ${item.is_active ? "checked" : ""} class="w-4 h-4 text-[#0D9488] rounded border-slate-300 focus:ring-[#0D9488]">
                    <span>Active</span>
                  </label>
                  <input
                    type="datetime-local"
                    id="deadline_${item.id}"
                    value="${formattedDeadline}"
                    class="px-3 py-2 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-xs text-[#0F172A] focus:outline-none focus:border-[#0D9488]"
                  />
                  <button
                    id="save_btn_${item.id}"
                    onclick="savePastpaperSettings(${item.id})"
                    class="px-4 py-2 bg-[#0D9488] hover:bg-[#0b7a6e] text-white rounded-xl text-xs font-semibold shadow-sm transition-all flex items-center gap-1.5"
                  >
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    <span>Save Settings</span>
                  </button>
                </div>
              </div>

              <!-- Accordion Toggle Button -->
              <div class="pt-3 border-t border-[#E2E8F0] flex justify-between items-center">
                <button
                  onclick="toggleSubmissions(${item.id})"
                  class="text-xs font-semibold text-[#0D9488] hover:text-[#0b7a6e] flex items-center gap-1.5 transition-colors"
                >
                  <svg id="icon_toggle_${item.id}" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                  </svg>
                  <span id="text_toggle_${item.id}">View Student Submissions</span>
                </button>
              </div>

              <!-- Dropdown Submissions Container -->
              <div id="submissions_wrapper_${item.id}" class="hidden pt-2">
                <div class="overflow-x-auto border border-[#E2E8F0] rounded-xl">
                  <table class="w-full text-left text-sm">
                    <thead class="bg-[#F8FAFC] text-[#64748B] uppercase text-xs border-b border-[#E2E8F0]">
                      <tr>
                        <th class="px-4 py-3 font-semibold">Student Name</th>
                        <th class="px-4 py-3 font-semibold">School</th>
                        <th class="px-4 py-3 font-semibold text-right">Submission Status</th>
                      </tr>
                    </thead>
                    <tbody id="submissions_table_${item.id}" class="divide-y divide-[#E2E8F0] bg-white">
                      <!-- Populated dynamically -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          `;
          })
          .join("");
      }

      async function savePastpaperSettings(id) {
        const btn = document.getElementById(`save_btn_${id}`);
        const originalContent = btn.innerHTML;
        const isActive = document.getElementById(`active_${id}`).checked;
        const deadline = document.getElementById(`deadline_${id}`).value;

        btn.disabled = true;
        btn.innerHTML = `
          <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Saving...</span>
        `;

        try {
          const res = await fetch("/api/pastpaper-submissions", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id,
              is_active: isActive,
              deadline: deadline || null,
            }),
          });

          if (!res.ok) throw new Error("Failed to update settings");

          window.location.reload();
        } catch (err) {
          console.error(err);
          alert("Error saving settings");
          btn.disabled = false;
          btn.innerHTML = originalContent;
        }
      }

      async function toggleSubmissions(id) {
        const wrapper = document.getElementById(`submissions_wrapper_${id}`);
        const icon = document.getElementById(`icon_toggle_${id}`);
        const text = document.getElementById(`text_toggle_${id}`);
        const tbody = document.getElementById(`submissions_table_${id}`);

        if (wrapper.classList.contains("hidden")) {
          wrapper.classList.remove("hidden");
          icon.style.transform = "rotate(180deg)";
          text.innerText = "Hide Student Submissions";

          tbody.innerHTML = `
            <tr>
              <td colspan="3" class="px-4 py-8 text-center text-[#64748B]">Loading students...</td>
            </tr>
          `;

          try {
            const res = await fetch(
              `/api/pastpaper-submissions?pastpaper_id=${id}`,
            );
            const students = await res.json();

            if (!students || students.length === 0) {
              tbody.innerHTML = `
                <tr>
                  <td colspan="3" class="px-4 py-6 text-center text-[#64748B]">No students found.</td>
                </tr>
              `;
              return;
            }

            tbody.innerHTML = students
              .map(
                (student) => `
                <tr id="row_${id}_${student.user_id}" class="transition-colors ${getRowClasses(student.status)}">
                  <td class="px-4 py-3 font-medium text-[#0F172A]">${student.full_name}</td>
                  <td class="px-4 py-3 text-[#64748B]">${student.school_name}</td>
                  <td class="px-4 py-3 text-right">
                    <select
                      onchange="updateStudentStatus(${id}, ${student.user_id}, this.value, this)"
                      class="px-3 py-1.5 border rounded-xl text-xs font-semibold focus:outline-none focus:border-[#0D9488] ${getStatusClasses(student.status)}"
                    >
                      <option value="missing" ${student.status === "missing" ? "selected" : ""}>Missing</option>
                      <option value="submitted" ${student.status === "submitted" ? "selected" : ""}>Submitted</option>
                    </select>
                  </td>
                </tr>
              `,
              )
              .join("");
          } catch (err) {
            console.error(err);
            tbody.innerHTML = `
              <tr>
                <td colspan="3" class="px-4 py-6 text-center text-red-600">Failed to load students.</td>
              </tr>
            `;
          }
        } else {
          wrapper.classList.add("hidden");
          icon.style.transform = "rotate(0deg)";
          text.innerText = "View Student Submissions";
        }
      }

      async function updateStudentStatus(
        pastpaperId,
        userId,
        status,
        selectElement,
      ) {
        // Instantly update both the table row background and the select dropdown styling
        const rowElement = document.getElementById(
          `row_${pastpaperId}_${userId}`,
        );
        if (rowElement) {
          rowElement.className = `transition-colors ${getRowClasses(status)}`;
        }
        selectElement.className = `px-3 py-1.5 border rounded-xl text-xs font-semibold focus:outline-none focus:border-[#0D9488] ${getStatusClasses(status)}`;

        try {
          const res = await fetch("/api/pastpaper-submissions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              pastpaper_id: pastpaperId,
              user_id: userId,
              status,
            }),
          });

          if (!res.ok) throw new Error("Failed to update status");
        } catch (err) {
          console.error(err);
          alert("Error updating student submission status");
        }
      }
    </script>
  </body>
</html>
