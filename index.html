<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr. Hassan's Math & Statistics Portal — Sign In / Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Math symbols floating background animation */
      @keyframes float {
        0% {
          transform: translateY(0px) rotate(0deg);
          opacity: 0.25;
        }
        50% {
          transform: translateY(-15px) rotate(5deg);
          opacity: 0.55;
        }
        100% {
          transform: translateY(0px) rotate(0deg);
          opacity: 0.25;
        }
      }
      .math-symbol {
        position: absolute;
        animation: float 6s ease-in-out infinite;
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-900 font-sans min-h-screen flex items-center justify-center relative overflow-x-hidden p-4"
  >
    <!-- MATHEMATICAL & STATISTICAL BACKGROUND ELEMENTS (Light Mode & Fully Responsive) -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
      <!-- Gradient mesh background layer -->
      <div
        class="absolute -top-40 -left-40 w-96 h-96 bg-teal-300/30 rounded-full blur-3xl"
      ></div>
      <div
        class="absolute top-1/2 -right-40 w-96 h-96 bg-cyan-300/30 rounded-full blur-3xl"
      ></div>
      <div
        class="absolute -bottom-40 left-1/3 w-96 h-96 bg-indigo-300/20 rounded-full blur-3xl"
      ></div>

      <!-- Grid pattern overlay -->
      <div
        class="absolute inset-0 bg-[linear-gradient(to_right,#cbd5e1_1px,transparent_1px),linear-gradient(to_bottom,#cbd5e1_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-35"
      ></div>

      <!-- Floating Math and Statistics Symbols -->
      <div
        class="math-symbol text-teal-600 font-serif text-3xl md:text-5xl top-[10%] left-[8%]"
        style="animation-delay: 0s"
      >
        ∑
      </div>
      <div
        class="math-symbol text-cyan-600 font-serif text-2xl md:text-4xl top-[20%] right-[12%]"
        style="animation-delay: 1.5s"
      >
        ∫
      </div>
      <div
        class="math-symbol text-teal-700 font-sans text-xl md:text-3xl top-[75%] left-[12%]"
        style="animation-delay: 2s"
      >
        f(x)
      </div>
      <div
        class="math-symbol text-indigo-600 font-serif text-3xl md:text-5xl bottom-[15%] right-[15%]"
        style="animation-delay: 1s"
      >
        π
      </div>
      <div
        class="math-symbol text-cyan-700 font-sans text-lg md:text-2xl top-[40%] left-[5%]"
        style="animation-delay: 2.5s"
      >
        μ
      </div>
      <div
        class="math-symbol text-teal-600 font-sans text-xl md:text-3xl top-[60%] right-[8%]"
        style="animation-delay: 3s"
      >
        σ²
      </div>
      <div
        class="math-symbol text-cyan-600 font-serif text-2xl md:text-4xl top-[15%] left-[30%]"
        style="animation-delay: 0.5s"
      >
        √x
      </div>
      <div
        class="math-symbol text-indigo-700 font-sans text-xl md:text-3xl bottom-[25%] left-[25%]"
        style="animation-delay: 3.5s"
      >
        P(A|B)
      </div>
      <div
        class="math-symbol text-teal-800 font-serif text-2xl md:text-4xl top-[80%] left-[45%]"
        style="animation-delay: 1.8s"
      >
        Δ
      </div>
      <div
        class="math-symbol text-cyan-700 font-mono text-sm md:text-xl top-[30%] right-[30%]"
        style="animation-delay: 2.2s"
      >
        y = mx + b
      </div>
    </div>

    <!-- MAIN CARD CONTAINER -->
    <div
      class="w-full max-w-md p-6 sm:p-8 bg-white/95 backdrop-blur-xl border border-slate-200/80 rounded-2xl shadow-xl shadow-slate-200/50 relative z-10"
    >
      <!-- Instructor Branding Header -->
      <div class="text-center mb-6">
        <div
          class="inline-flex items-center justify-center px-3 py-1 mb-3 rounded-full bg-teal-50 border border-teal-200 text-teal-700 text-xs font-semibold tracking-wider uppercase"
        >
          Mr. Hassan's Classroom
        </div>
        <h1
          class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900"
        >
          Math & Statistics Portal
        </h1>
        <p class="text-sm text-slate-500 mt-1">
          Manage your account and dashboard access
        </p>
      </div>

      <!-- Toggle Tabs -->
      <div
        class="flex rounded-lg bg-slate-100 p-1 border border-slate-200 mb-6"
      >
        <button
          id="tabSigninBtn"
          type="button"
          onclick="switchTab('signin')"
          class="flex-1 py-2 text-sm font-semibold rounded-md transition-all bg-[#0D9488] text-white shadow-sm"
        >
          Sign In
        </button>
        <button
          id="tabSignupBtn"
          type="button"
          onclick="switchTab('signup')"
          class="flex-1 py-2 text-sm font-semibold rounded-md transition-all text-slate-500 hover:text-slate-900"
        >
          Sign Up
        </button>
      </div>

      <div
        id="alertBox"
        class="hidden mb-4 p-3 text-sm rounded-lg border"
      ></div>

      <!-- SIGN IN FORM -->
      <form id="signinForm" onsubmit="handleSignin(event)" class="space-y-4">
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1"
            >Full Name</label
          >
          <input
            type="text"
            id="signinName"
            required
            class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0D9488] bg-white text-slate-900 placeholder-slate-400 shadow-sm"
            placeholder="Enter your full name"
          />
        </div>
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="signinPassword"
            required
            class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0D9488] bg-white text-slate-900 placeholder-slate-400 shadow-sm"
            placeholder="••••••••"
          />
        </div>
        <button
          type="submit"
          id="signinBtn"
          class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-lg text-sm transition-colors shadow-sm flex items-center justify-center cursor-pointer"
        >
          <span>Sign In</span>
        </button>
      </form>

      <!-- SIGN UP FORM -->
      <form
        id="signupForm"
        onsubmit="handleSignup(event)"
        class="space-y-4 hidden"
      >
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1"
            >Full Name</label
          >
          <input
            type="text"
            id="signupFullName"
            required
            class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0D9488] bg-white text-slate-900 placeholder-slate-400 shadow-sm"
            placeholder="Enter your full name"
          />
        </div>
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1"
            >School Name</label
          >
          <select
            id="signupSchoolName"
            required
            class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0D9488] bg-white text-slate-900 shadow-sm"
          >
            <option value="">Loading schools...</option>
          </select>
        </div>
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="signupPassword"
            required
            class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0D9488] bg-white text-slate-900 placeholder-slate-400 shadow-sm"
            placeholder="••••••••"
          />
        </div>
        <button
          type="submit"
          id="signupBtn"
          class="w-full py-2.5 bg-[#0D9488] hover:bg-teal-700 text-white font-semibold rounded-lg text-sm transition-colors shadow-sm flex items-center justify-center cursor-pointer"
        >
          <span>Create Account</span>
        </button>
      </form>
    </div>

    <script>
      // Fetch schools on load to populate dropdown
      document.addEventListener("DOMContentLoaded", fetchSchools);

      async function fetchSchools() {
        const select = document.getElementById("signupSchoolName");
        try {
          const res = await fetch("/api/schools");
          const schools = await res.json();
          if (schools && schools.length > 0) {
            select.innerHTML =
              `<option value="">Select your school...</option>` +
              schools
                .map(
                  (s) =>
                    `<option value="${s.school_name}">${s.school_name}</option>`,
                )
                .join("");
          } else {
            select.innerHTML = `<option value="">No schools available</option>`;
          }
        } catch (err) {
          console.error("Failed to load schools", err);
          select.innerHTML = `<option value="">Error loading schools</option>`;
        }
      }

      function switchTab(tab) {
        const signinForm = document.getElementById("signinForm");
        const signupForm = document.getElementById("signupForm");
        const tabSigninBtn = document.getElementById("tabSigninBtn");
        const tabSignupBtn = document.getElementById("tabSignupBtn");
        document.getElementById("alertBox").classList.add("hidden");

        if (tab === "signin") {
          signinForm.classList.remove("hidden");
          signupForm.classList.add("hidden");
          tabSigninBtn.className =
            "flex-1 py-2 text-sm font-semibold rounded-md transition-all bg-[#0D9488] text-white shadow-sm";
          tabSignupBtn.className =
            "flex-1 py-2 text-sm font-semibold rounded-md transition-all text-slate-500 hover:text-slate-900";
        } else {
          signupForm.classList.remove("hidden");
          signinForm.classList.add("hidden");
          tabSignupBtn.className =
            "flex-1 py-2 text-sm font-semibold rounded-md transition-all bg-[#0D9488] text-white shadow-sm";
          tabSigninBtn.className =
            "flex-1 py-2 text-sm font-semibold rounded-md transition-all text-slate-500 hover:text-slate-900";
        }
      }

      function showAlert(msg, isError = true) {
        const box = document.getElementById("alertBox");
        box.textContent = msg;
        box.className = `mb-4 p-3 text-sm rounded-lg border ${isError ? "bg-red-50 text-red-700 border-red-200" : "bg-emerald-50 text-emerald-700 border-emerald-200"}`;
      }

      function handleRedirect(user) {
        localStorage.setItem("user", JSON.stringify(user));
        setTimeout(() => {
          if (user.is_admin) {
            window.location.href = "admindashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
        }, 600);
      }

      async function handleSignin(e) {
        e.preventDefault();
        const btn = document.getElementById("signinBtn");
        const originalText = btn.innerHTML;

        btn.disabled = true;
        btn.innerHTML = `Signing you in...`;

        const full_name = document.getElementById("signinName").value.trim();
        const password = document.getElementById("signinPassword").value;

        try {
          const res = await fetch("/api/signin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ full_name, password }),
          });
          const data = await res.json();
          if (data.success) {
            showAlert("Signed in successfully! Redirecting...", false);
            handleRedirect(data.user);
          } else {
            showAlert(data.error);
            btn.disabled = false;
            btn.innerHTML = originalText;
          }
        } catch (err) {
          showAlert("Connection error to server.");
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      }

      async function handleSignup(e) {
        e.preventDefault();
        const btn = document.getElementById("signupBtn");
        const originalText = btn.innerHTML;

        btn.disabled = true;
        btn.innerHTML = `Creating account...`;

        const full_name = document
          .getElementById("signupFullName")
          .value.trim();
        const school_name = document.getElementById("signupSchoolName").value;
        const password = document.getElementById("signupPassword").value;

        try {
          const res = await fetch("/api/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              full_name,
              school_name,
              password,
              account_type: "user",
            }),
          });
          const data = await res.json();
          if (data.success) {
            showAlert("Account created successfully! Redirecting...", false);
            handleRedirect(data.user);
          } else {
            showAlert(data.error);
            btn.disabled = false;
            btn.innerHTML = originalText;
          }
        } catch (err) {
          showAlert("Connection error to server.");
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      }
    </script>
  </body>
</html>
