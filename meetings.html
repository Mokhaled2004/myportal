<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Meetings — Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Guerrilla&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex">
    <!-- Sidebar Container -->
    <aside
      id="sidebarContainer"
      class="hidden md:flex flex-col shrink-0 h-screen sticky top-0"
    ></aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">    <!-- Mobile burger button (shown only on mobile) -->
    <div class="md:hidden sticky top-0 z-30 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center gap-3 shadow-sm">
      <button
        onclick="if(typeof openMobileSidebar==='function')openMobileSidebar();"
        class="p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[#0F172A] hover:bg-slate-100 transition-colors flex-shrink-0"
        aria-label="Open menu"
      >
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-[#0F172A] text-base tracking-tight" style="font-family:'Urbanist',sans-serif;">MyPortal</span>
    </div>      <div class="p-6 md:p-10">
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
      >
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
            Live Meetings
          </h1>
          <p class="text-sm text-[#64748B]">
            View and join your scheduled live Zoom or video sessions on the
            weekly grid.
          </p>
        </div>
      </div>

      <!-- Week Navigation Bar -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl p-4 shadow-sm mb-6 flex flex-col sm:flex-row items-center justify-between gap-4"
      >
        <div class="flex items-center gap-3">
          <button
            onclick="changeWeek(-1)"
            class="p-2 bg-[#F8FAFC] hover:bg-slate-100 border border-[#E2E8F0] rounded-xl text-[#0F172A] transition-colors"
            title="Previous Week"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>
          <span
            id="currentWeekLabel"
            class="text-sm font-bold text-[#0F172A] tracking-wide"
          ></span>
          <button
            onclick="changeWeek(1)"
            class="p-2 bg-[#F8FAFC] hover:bg-slate-100 border border-[#E2E8F0] rounded-xl text-[#0F172A] transition-colors"
            title="Next Week"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>
        <button
          onclick="goToCurrentWeek()"
          class="px-3.5 py-2 text-xs font-semibold bg-[#F8FAFC] hover:bg-slate-100 text-[#64748B] hover:text-[#0F172A] border border-[#E2E8F0] rounded-xl transition-colors"
        >
          This Week
        </button>
      </div>

      <!-- Weekly Grid View -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl shadow-sm overflow-hidden"
      >
        <div class="overflow-x-auto">
          <div
            id="weeklyGridContainer"
            class="grid grid-cols-1 md:grid-cols-7 min-w-[900px] divide-x divide-y md:divide-y-0 divide-[#E2E8F0]"
          >
            <!-- Populated dynamically by JS -->
          </div>
        </div>
      </div>
    </div>
    </main>

    <script>
      let allMeetings = [];
      let currentWeekStartDate = getSunday(new Date());

      // Check authentication
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.full_name) {
        window.location.href = "index.html";
      } else {
        fetchMeetings();
        // Auto-refresh meetings every 5 seconds silently
        setInterval(fetchMeetings, 5000);
      }

      // Load Sidebar component dynamically
      fetch("sidebar.html")
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById("sidebarContainer");
          container.innerHTML = html;
          const scripts = container.querySelectorAll("script");
          scripts.forEach((script) => {
            const newScript = document.createElement("script");
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
          if (typeof renderSidebar === "function") {
            renderSidebar("Meetings");
          }
        });

      function getSunday(d) {
        d = new Date(d);
        const day = d.getDay();
        const diff = d.getDate() - day; // Adjust to Sunday
        return new Date(d.setDate(diff));
      }

      function changeWeek(direction) {
        currentWeekStartDate.setDate(
          currentWeekStartDate.getDate() + direction * 7,
        );
        renderWeeklyGrid();
      }

      function goToCurrentWeek() {
        currentWeekStartDate = getSunday(new Date());
        renderWeeklyGrid();
      }

      async function fetchMeetings() {
        try {
          const res = await fetch("/api/meetings");
          allMeetings = await res.json();
          renderWeeklyGrid();
        } catch (err) {
          console.error("Failed to load meetings", err);
        }
      }

      function renderWeeklyGrid() {
        const container = document.getElementById("weeklyGridContainer");
        container.innerHTML = "";

        const weekDays = [];
        let tempDate = new Date(currentWeekStartDate);
        for (let i = 0; i < 7; i++) {
          weekDays.push(new Date(tempDate));
          tempDate.setDate(tempDate.getDate() + 1);
        }

        const startStr = weekDays[0].toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        const endStr = weekDays[6].toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        document.getElementById("currentWeekLabel").textContent =
          `${startStr} — ${endStr}`;

        const dayNames = [
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
        ];

        weekDays.forEach((dateObj, index) => {
          const year = dateObj.getFullYear();
          const month = String(dateObj.getMonth() + 1).padStart(2, "0");
          const day = String(dateObj.getDate()).padStart(2, "0");
          const dateString = `${year}-${month}-${day}`;

          const formattedHeaderDate = dateObj.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
          });

          const dayMeetings = allMeetings.filter((m) => {
            return m.meeting_date === dateString;
          });

          const colDiv = document.createElement("div");
          colDiv.className = "flex flex-col bg-white min-h-[450px]";

          let meetingsHtml = "";
          if (dayMeetings.length === 0) {
            meetingsHtml = `
              <div class="flex-1 flex items-center justify-center p-4 text-xs text-[#64748B] italic">
                No meetings scheduled
              </div>
            `;
          } else {
            meetingsHtml =
              `<div class="p-3 space-y-3 flex-1">` +
              dayMeetings
                .map(
                  (m) => `
              <div class="bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl p-3 shadow-xs hover:border-[#0D9488] transition-colors relative group flex flex-col justify-between gap-3">
                <div>
                  <h4 class="font-semibold text-xs text-[#0F172A] leading-snug mb-1">${m.title}</h4>
                  <div class="text-[11px] font-medium text-[#0D9488] flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    ${m.hours}
                  </div>
                </div>
                <a href="${m.url}" target="_blank" class="w-full py-2 bg-[#0D9488] hover:bg-[#0b7a70] text-white font-semibold rounded-lg text-xs transition-colors flex items-center justify-center gap-1.5 shadow-sm">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                  </svg>
                  Join Meeting
                </a>
              </div>
            `,
                )
                .join("") +
              `</div>`;
          }

          colDiv.innerHTML = `
            <div class="bg-[#F8FAFC] p-3 border-b border-[#E2E8F0] text-center">
              <div class="text-xs font-bold text-[#64748B] uppercase tracking-wider">${dayNames[index]}</div>
              <div class="text-sm font-bold text-[#0F172A]">${formattedHeaderDate}</div>
            </div>
            ${meetingsHtml}
          `;

          container.appendChild(colDiv);
        });
      }
    </script>
  </body>
</html>
