<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Announcements — Portal Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex">
    <!-- Sidebar Container -->
    <aside
      id="sidebarContainer"
      class="hidden md:flex flex-col shrink-0 h-screen sticky top-0"
    ></aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">    <!-- Mobile burger button (shown only on mobile) -->
    <div class="md:hidden sticky top-0 z-30 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center gap-3 shadow-sm">
      <button
        onclick="if(typeof openMobileSidebar==='function')openMobileSidebar();"
        class="p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[#0F172A] hover:bg-slate-100 transition-colors flex-shrink-0"
        aria-label="Open menu"
      >
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-[#0F172A] text-base tracking-tight" style="font-family:'Urbanist',sans-serif;">MyPortal</span>
    </div>      <div class="p-6 md:p-10">
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
      >
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
            Manage Announcements
          </h1>
          <p class="text-sm text-[#64748B]">
            Create and manage broadcast announcements for students.
          </p>
        </div>
        <div>
          <button
            onclick="openAddModal()"
            class="px-4 py-2.5 bg-[#0D9488] hover:bg-[#059669] text-white font-semibold rounded-xl text-sm transition-all shadow-sm flex items-center gap-2"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              />
            </svg>
            Add Announcement
          </button>
        </div>
      </div>

      <!-- Filters Bar -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl p-4 shadow-sm mb-6 flex flex-col sm:flex-row items-center justify-between gap-4"
      >
        <div class="relative w-full sm:w-80">
          <svg
            class="absolute left-3.5 top-3 w-4 h-4 text-[#64748B]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            type="text"
            id="searchInput"
            oninput="renderAnnouncements()"
            placeholder="Search announcement title..."
            class="w-full pl-10 pr-4 py-2 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488] text-[#0F172A]"
          />
        </div>
      </div>

      <!-- Announcements List Container -->
      <div id="announcementsContainer" class="space-y-4">
        <!-- Populated by JS -->
      </div>
    </div>
    </main>

    <!-- Create / Edit Announcement Modal -->
    <div
      id="announcementModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white rounded-2xl p-6 sm:p-8 max-w-lg w-full shadow-xl border border-[#E2E8F0]"
      >
        <div class="flex justify-between items-center mb-4">
          <h2 id="modalTitle" class="text-lg font-bold text-[#0F172A]">
            Add Announcement
          </h2>
          <button
            onclick="closeModal()"
            class="text-[#64748B] hover:text-[#0F172A]"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <form
          id="announcementForm"
          onsubmit="handleFormSubmit(event)"
          class="space-y-4"
        >
          <input type="hidden" id="announcementId" />
          <div>
            <label
              class="block text-xs font-bold text-[#64748B] uppercase tracking-wider mb-1.5"
              >Title</label
            >
            <input
              type="text"
              id="announcementTitleInput"
              required
              placeholder="e.g. Midterm Schedule Update"
              class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488]"
            />
          </div>
          <div>
            <label
              class="block text-xs font-bold text-[#64748B] uppercase tracking-wider mb-1.5"
              >Priority</label
            >
            <select
              id="announcementPriorityInput"
              class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488] text-[#0F172A]"
            >
              <option value="normal">Normal</option>
              <option value="urgent">Urgent</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div>
            <label
              class="block text-xs font-bold text-[#64748B] uppercase tracking-wider mb-1.5"
              >Description</label
            >
            <textarea
              id="announcementDescriptionInput"
              required
              rows="4"
              placeholder="Enter announcement details..."
              class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488]"
            ></textarea>
          </div>

          <div class="flex items-center justify-end gap-3 pt-2">
            <button
              type="button"
              onclick="closeModal()"
              class="px-4 py-2 text-sm font-semibold text-[#64748B] hover:bg-slate-100 rounded-xl transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              id="saveBtn"
              class="px-5 py-2.5 bg-[#0D9488] hover:bg-[#059669] text-white text-sm font-semibold rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2 min-w-[110px]"
            >
              <span id="saveBtnText">Save</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div
      id="deleteModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white rounded-2xl p-6 sm:p-8 max-w-sm w-full shadow-xl border border-[#E2E8F0] text-center"
      >
        <div
          class="w-12 h-12 bg-[#FEF2F2] text-[#B91C1C] rounded-full flex items-center justify-center mx-auto mb-4"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>
        <h2 class="text-lg font-bold text-[#0F172A] mb-2">
          Delete Announcement
        </h2>
        <p class="text-sm text-[#64748B] mb-6">
          Are you sure you want to delete this announcement?
        </p>
        <input type="hidden" id="deleteAnnouncementId" />
        <div class="flex items-center justify-center gap-3">
          <button
            type="button"
            onclick="closeDeleteModal()"
            class="flex-1 px-4 py-2.5 text-sm font-semibold text-[#64748B] hover:bg-slate-100 rounded-xl transition-colors border border-[#E2E8F0]"
          >
            Cancel
          </button>
          <button
            type="button"
            id="confirmDeleteBtn"
            onclick="confirmDeleteAnnouncement()"
            class="flex-1 px-4 py-2.5 bg-[#B91C1C] hover:bg-[#991B1B] text-white text-sm font-semibold rounded-xl transition-colors shadow-sm"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <!-- Unauthorized Access Modal -->
    <div
      id="unauthorizedModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-xl text-center border border-[#E2E8F0]"
      >
        <div
          class="w-12 h-12 bg-[#FEF2F2] text-[#B91C1C] rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-xl"
        >
          !
        </div>
        <h2 class="text-lg font-bold text-[#0F172A] mb-2">
          Unauthorized Access
        </h2>
        <p class="text-sm text-[#64748B] mb-6">
          You do not have administrative privileges to view this page.
        </p>
        <button
          onclick="window.location.href = 'dashboard.html'"
          class="w-full py-2.5 bg-[#0F172A] hover:bg-slate-800 text-white font-semibold rounded-xl text-sm transition-colors"
        >
          Go to User Dashboard
        </button>
      </div>
    </div>

    <script>
      let allAnnouncements = [];

      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.full_name) {
        window.location.href = "index.html";
      } else if (!user.is_admin) {
        document.getElementById("unauthorizedModal").classList.remove("hidden");
        document.getElementById("unauthorizedModal").classList.add("flex");
      } else {
        fetchAnnouncementsData();
      }

      fetch("adminsidebar.html")
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById("sidebarContainer");
          container.innerHTML = html;
          const scripts = container.querySelectorAll("script");
          scripts.forEach((script) => {
            const newScript = document.createElement("script");
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
          if (typeof renderSidebar === "function") {
            renderSidebar("Post Announcements");
          }
        });

      async function fetchAnnouncementsData() {
        const container = document.getElementById("announcementsContainer");
        container.innerHTML = `
          <div class="py-12 text-center bg-white border border-[#E2E8F0] rounded-2xl">
            <div class="flex flex-col items-center justify-center gap-3">
              <div class="w-8 h-8 border-4 border-[#0D9488] border-t-transparent rounded-full animate-spin"></div>
              <p class="text-sm font-medium text-[#64748B]">Loading announcements...</p>
            </div>
          </div>
        `;

        try {
          const res = await fetch("/api/announcements");
          allAnnouncements = await res.json();
          renderAnnouncements();
        } catch (err) {
          console.error("Failed to load announcements", err);
          container.innerHTML = `
            <div class="p-8 text-center bg-white border border-[#E2E8F0] rounded-2xl text-[#B91C1C]">
              Failed to load announcements. Please try again.
            </div>
          `;
        }
      }

      function renderAnnouncements() {
        const container = document.getElementById("announcementsContainer");
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();

        const filtered = allAnnouncements.filter((item) => {
          return (
            item.title.toLowerCase().includes(query) ||
            item.description.toLowerCase().includes(query)
          );
        });

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="bg-white border border-[#E2E8F0] rounded-2xl p-12 text-center shadow-sm">
              <p class="text-sm font-medium text-[#64748B]">No announcements found.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = filtered
          .map((item) => {
            let priorityBadge = "";
            if (item.priority === "urgent") {
              priorityBadge = `<span class="px-2.5 py-0.5 text-xs font-semibold bg-red-50 text-red-700 border border-red-200 rounded-md">Urgent</span>`;
            } else if (item.priority === "low") {
              priorityBadge = `<span class="px-2.5 py-0.5 text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200 rounded-md">Low</span>`;
            } else {
              priorityBadge = `<span class="px-2.5 py-0.5 text-xs font-semibold bg-teal-50 text-teal-700 border border-teal-200 rounded-md">Normal</span>`;
            }

            const formattedDate = item.created_at
              ? new Date(item.created_at).toLocaleString()
              : "";

            return `
            <div class="bg-white border border-[#E2E8F0] rounded-2xl p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div class="space-y-1.5 max-w-3xl">
                <div class="flex items-center gap-2 flex-wrap">
                  ${priorityBadge}
                  <span class="text-xs text-[#64748B]">Created at: ${formattedDate}</span>
                </div>
                <h3 class="text-base font-bold text-[#0F172A]">${item.title}</h3>
                <p class="text-sm text-[#64748B] whitespace-pre-line leading-relaxed">${item.description}</p>
              </div>
              <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
                <button type="button" onclick="openEditModal(${item.id})" class="px-3 py-1.5 text-xs font-semibold text-[#64748B] hover:text-[#0D9488] hover:bg-slate-100 rounded-lg transition-colors border border-[#E2E8F0]">Edit</button>
                <button type="button" onclick="openDeleteModal(${item.id})" class="px-3 py-1.5 text-xs font-semibold text-[#B91C1C] hover:bg-[#FEF2F2] rounded-lg transition-colors border border-[#E2E8F0]">Delete</button>
              </div>
            </div>
          `;
          })
          .join("");
      }

      function openAddModal() {
        document.getElementById("modalTitle").textContent = "Add Announcement";
        document.getElementById("announcementId").value = "";
        document.getElementById("announcementTitleInput").value = "";
        document.getElementById("announcementPriorityInput").value = "normal";
        document.getElementById("announcementDescriptionInput").value = "";
        document.getElementById("announcementModal").classList.remove("hidden");
        document.getElementById("announcementModal").classList.add("flex");
      }

      function openEditModal(id) {
        const item = allAnnouncements.find((a) => a.id === id);
        if (!item) return;

        document.getElementById("modalTitle").textContent = "Edit Announcement";
        document.getElementById("announcementId").value = item.id;
        document.getElementById("announcementTitleInput").value = item.title;
        document.getElementById("announcementPriorityInput").value =
          item.priority || "normal";
        document.getElementById("announcementDescriptionInput").value =
          item.description;
        document.getElementById("announcementModal").classList.remove("hidden");
        document.getElementById("announcementModal").classList.add("flex");
      }

      function closeModal() {
        document.getElementById("announcementModal").classList.remove("flex");
        document.getElementById("announcementModal").classList.add("hidden");
      }

      function openDeleteModal(id) {
        document.getElementById("deleteAnnouncementId").value = id;
        document.getElementById("deleteModal").classList.remove("hidden");
        document.getElementById("deleteModal").classList.add("flex");
      }

      function closeDeleteModal() {
        document.getElementById("deleteModal").classList.remove("flex");
        document.getElementById("deleteModal").classList.add("hidden");
      }

      async function confirmDeleteAnnouncement() {
        const id = document.getElementById("deleteAnnouncementId").value;
        if (!id) return;

        const confirmBtn = document.getElementById("confirmDeleteBtn");
        confirmBtn.disabled = true;
        confirmBtn.textContent = "Deleting...";

        try {
          const res = await fetch(`/api/announcements?id=${id}`, {
            method: "DELETE",
          });
          if (res.ok) {
            closeDeleteModal();
            fetchAnnouncementsData();
          }
        } catch (err) {
          console.error("Error deleting announcement:", err);
          alert("An error occurred.");
        } finally {
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Delete";
        }
      }

      async function handleFormSubmit(event) {
        event.preventDefault();
        const id = document.getElementById("announcementId").value;
        const title = document.getElementById("announcementTitleInput").value;
        const priority = document.getElementById(
          "announcementPriorityInput",
        ).value;
        const description = document.getElementById(
          "announcementDescriptionInput",
        ).value;

        const saveBtn = document.getElementById("saveBtn");
        const saveBtnText = document.getElementById("saveBtnText");

        saveBtn.disabled = true;
        saveBtnText.innerHTML = `
          <svg class="w-4 h-4 animate-spin inline-block mr-1.5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg> Saving...
        `;

        const method = id ? "PUT" : "POST";
        const bodyData = id
          ? { id: parseInt(id), title, description, priority }
          : { title, description, priority };

        try {
          const res = await fetch("/api/announcements", {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bodyData),
          });

          if (res.ok) {
            closeModal();
            fetchAnnouncementsData();
          } else {
            alert("Failed to save announcement.");
          }
        } catch (err) {
          console.error("Error saving announcement:", err);
          alert("An error occurred.");
        } finally {
          saveBtn.disabled = false;
          saveBtnText.textContent = "Save";
        }
      }
    </script>
  </body>
</html>
