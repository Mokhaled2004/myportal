<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Announcements — Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex">
    <!-- Sidebar Container -->
    <aside
      id="sidebarContainer"
      class="hidden md:flex flex-col shrink-0 h-screen sticky top-0"
    ></aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">
    <!-- Mobile burger button (shown only on mobile) -->
    <div class="md:hidden sticky top-0 z-30 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center gap-3 shadow-sm">
      <button
        onclick="if(typeof openMobileSidebar==='function')openMobileSidebar();"
        class="p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[#0F172A] hover:bg-slate-100 transition-colors flex-shrink-0"
        aria-label="Open menu"
      >
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-[#0F172A] text-base tracking-tight" style="font-family:'Urbanist',sans-serif;">MyPortal</span>
    </div>
      <div class="p-6 md:p-10">
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
      >
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
            Announcements
          </h1>
          <p class="text-sm text-[#64748B]">
            View the latest school announcements and broadcast updates.
          </p>
        </div>
      </div>

      <!-- Filters and Search Bar -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl p-4 sm:p-6 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <div class="relative w-full md:w-96">
          <svg
            class="absolute left-3.5 top-3.5 w-4 h-4 text-[#64748B]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            type="text"
            id="searchInput"
            oninput="filterAnnouncements()"
            placeholder="Search announcements by title or content..."
            class="w-full pl-10 pr-4 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488] text-[#0F172A]"
          />
        </div>
        <div
          class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-end"
        >
          <!-- Priority Filter -->
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label
              class="text-xs font-semibold text-[#64748B] uppercase tracking-wider"
              >Priority:</label
            >
            <div class="relative flex-1 sm:flex-none">
              <select
                id="priorityFilterSelect"
                onchange="filterAnnouncements()"
                class="w-full appearance-none pl-3 pr-9 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm font-medium text-[#0F172A] focus:outline-none focus:border-[#0D9488] hover:border-[#0D9488] transition-colors cursor-pointer"
              >
                <option value="all">All Priorities</option>
                <option value="urgent">Urgent</option>
                <option value="normal">Normal</option>
                <option value="low">Low</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-[#64748B]"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
            </div>
          </div>

          <!-- Sort Selector -->
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <label
              class="text-xs font-semibold text-[#64748B] uppercase tracking-wider"
              >Sort:</label
            >
            <div class="relative flex-1 sm:flex-none">
              <select
                id="sortSelect"
                onchange="filterAnnouncements()"
                class="w-full appearance-none pl-3 pr-9 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm font-medium text-[#0F172A] focus:outline-none focus:border-[#0D9488] hover:border-[#0D9488] transition-colors cursor-pointer"
              >
                <option value="date-new">Date: Newest First</option>
                <option value="date-old">Date: Oldest First</option>
                <option value="title">Title (A-Z)</option>
              </select>
              <div
                class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-[#64748B]"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Announcements List Container -->
      <div id="announcementsContainer" class="space-y-4">
        <!-- Populated dynamically by JS -->
      </div>
      </div>
    </main>

    <script>
      let allAnnouncements = [];
      let refreshInterval = null;

      // Check authentication
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.full_name) {
        window.location.href = "index.html";
      } else {
        init();
      }

      // Load Sidebar component dynamically
      fetch("sidebar.html")
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById("sidebarContainer");
          container.innerHTML = html;
          const scripts = container.querySelectorAll("script");
          scripts.forEach((script) => {
            const newScript = document.createElement("script");
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
          if (typeof renderSidebar === "function") {
            renderSidebar("Announcements");
          }
        });

      async function init() {
        const container = document.getElementById("announcementsContainer");
        container.innerHTML = `
          <div class="py-20 flex flex-col items-center justify-center gap-3">
            <div class="w-8 h-8 border-4 border-[#0D9488] border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-medium text-[#64748B]">Loading announcements...</p>
          </div>
        `;

        await fetchAnnouncements(true);

        // Auto-refresh announcements every 5 seconds silently
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => fetchAnnouncements(false), 5000);
      }

      async function fetchAnnouncements(showLoader = false) {
        if (showLoader) {
          const container = document.getElementById("announcementsContainer");
          if (!container.innerHTML.includes("animate-spin")) {
            container.innerHTML = `
              <div class="py-20 flex flex-col items-center justify-center gap-3">
                <div class="w-8 h-8 border-4 border-[#0D9488] border-t-transparent rounded-full animate-spin"></div>
                <p class="text-sm font-medium text-[#64748B]">Loading announcements...</p>
              </div>
            `;
          }
        }

        try {
          const res = await fetch("/api/announcements");
          allAnnouncements = await res.json();
          filterAnnouncements();
        } catch (err) {
          console.error("Failed to load announcements", err);
          const container = document.getElementById("announcementsContainer");
          container.innerHTML = `
            <div class="p-12 text-center bg-white border border-[#E2E8F0] rounded-2xl text-[#B91C1C]">
              Failed to load announcements. Please refresh the page.
            </div>
          `;
        }
      }

      function filterAnnouncements() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const priorityFilter = document.getElementById(
          "priorityFilterSelect",
        ).value;
        const sortBy = document.getElementById("sortSelect").value;

        let filtered = allAnnouncements.filter((item) => {
          const matchesQuery =
            (item.title && item.title.toLowerCase().includes(query)) ||
            (item.description &&
              item.description.toLowerCase().includes(query));

          const matchesPriority =
            priorityFilter === "all" || item.priority === priorityFilter;

          return matchesQuery && matchesPriority;
        });

        filtered.sort((a, b) => {
          const dateA = a.created_at ? new Date(a.created_at).getTime() : 0;
          const dateB = b.created_at ? new Date(b.created_at).getTime() : 0;
          const titleA = a.title || "";
          const titleB = b.title || "";

          if (sortBy === "date-new") {
            return dateB - dateA;
          } else if (sortBy === "date-old") {
            return dateA - dateB;
          } else if (sortBy === "title") {
            return titleA.localeCompare(titleB);
          }
        });

        renderAnnouncements(filtered);
      }

      function renderAnnouncements(items) {
        const container = document.getElementById("announcementsContainer");

        if (!items || items.length === 0) {
          container.innerHTML = `
            <div class="bg-white border border-[#E2E8F0] rounded-2xl p-12 text-center shadow-sm">
              <p class="text-sm font-medium text-[#64748B]">No announcements found matching your filters.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = items
          .map((item) => {
            let priorityBadge = "";
            let borderColor = "border-[#E2E8F0]";

            if (item.priority === "urgent") {
              priorityBadge = `<span class="px-2.5 py-1 text-xs font-semibold bg-red-50 text-red-700 border border-red-200 rounded-lg flex items-center gap-1.5"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>Urgent</span>`;
              borderColor = "border-red-200";
            } else if (item.priority === "low") {
              priorityBadge = `<span class="px-2.5 py-1 text-xs font-semibold bg-slate-100 text-slate-700 border border-slate-200 rounded-lg">Low Priority</span>`;
            } else {
              priorityBadge = `<span class="px-2.5 py-1 text-xs font-semibold bg-teal-50 text-teal-700 border border-teal-200 rounded-lg">Normal</span>`;
            }

            const formattedDate = item.created_at
              ? new Date(item.created_at).toLocaleString("en-US", {
                  month: "short",
                  day: "numeric",
                  year: "numeric",
                  hour: "numeric",
                  minute: "2-digit",
                })
              : "";

            return `
            <div class="bg-white border ${borderColor} rounded-2xl p-6 shadow-sm hover:shadow-md transition-all flex flex-col justify-between gap-4 group">
              <div class="space-y-3">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                  <div class="flex items-center gap-2 flex-wrap">
                    ${priorityBadge}
                  </div>
                  <div class="text-xs text-[#64748B] flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-[#0D9488]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>${formattedDate}</span>
                  </div>
                </div>
                <h3 class="text-lg font-bold text-[#0F172A] group-hover:text-[#0D9488] transition-colors">${item.title}</h3>
                <p class="text-sm text-[#64748B] whitespace-pre-line leading-relaxed">${item.description}</p>
              </div>
            </div>
          `;
          })
          .join("");
      }
    </script>
  </body>
</html>
