<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Meetings — Portal Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Guerrilla&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex">
    <!-- Sidebar Container -->
    <aside
      id="sidebarContainer"
      class="hidden md:flex flex-col shrink-0 h-screen sticky top-0"
    ></aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">    <!-- Mobile burger button (shown only on mobile) -->
    <div class="md:hidden sticky top-0 z-30 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center gap-3 shadow-sm">
      <button
        onclick="if(typeof openMobileSidebar==='function')openMobileSidebar();"
        class="p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[#0F172A] hover:bg-slate-100 transition-colors flex-shrink-0"
        aria-label="Open menu"
      >
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-[#0F172A] text-base tracking-tight" style="font-family:'Urbanist',sans-serif;">MyPortal</span>
    </div>      <div class="p-6 md:p-10">
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
      >
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
            Manage Meetings
          </h1>
          <p class="text-sm text-[#64748B]">
            Schedule and organize live Zoom or video meetings on a weekly grid.
          </p>
        </div>
        <div class="flex items-center gap-3">
          <button
            onclick="openAddModal()"
            class="px-4 py-2.5 bg-[#0D9488] hover:bg-[#059669] text-white font-semibold rounded-xl text-sm transition-all shadow-sm flex items-center gap-2"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              />
            </svg>
            Add New Meeting
          </button>
        </div>
      </div>

      <!-- Week Navigation Bar -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl p-4 shadow-sm mb-6 flex flex-col sm:flex-row items-center justify-between gap-4"
      >
        <div class="flex items-center gap-3">
          <button
            onclick="changeWeek(-1)"
            class="p-2 bg-[#F8FAFC] hover:bg-slate-100 border border-[#E2E8F0] rounded-xl text-[#0F172A] transition-colors"
            title="Previous Week"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              />
            </svg>
          </button>
          <span
            id="currentWeekLabel"
            class="text-sm font-bold text-[#0F172A] tracking-wide"
          ></span>
          <button
            onclick="changeWeek(1)"
            class="p-2 bg-[#F8FAFC] hover:bg-slate-100 border border-[#E2E8F0] rounded-xl text-[#0F172A] transition-colors"
            title="Next Week"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              />
            </svg>
          </button>
        </div>
        <button
          onclick="goToCurrentWeek()"
          class="px-3.5 py-2 text-xs font-semibold bg-[#F8FAFC] hover:bg-slate-100 text-[#64748B] hover:text-[#0F172A] border border-[#E2E8F0] rounded-xl transition-colors"
        >
          This Week
        </button>
      </div>

      <!-- Weekly Grid View -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl shadow-sm overflow-hidden"
      >
        <div class="overflow-x-auto">
          <div
            id="weeklyGridContainer"
            class="grid grid-cols-1 md:grid-cols-7 min-w-[900px] divide-x divide-y md:divide-y-0 divide-[#E2E8F0]"
          >
            <!-- Populated dynamically by JS -->
          </div>
        </div>
      </div>
    </div>
    </main>

    <!-- Add / Edit Meeting Modal -->
    <div
      id="meetingModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-xl border border-[#E2E8F0]"
      >
        <div class="flex justify-between items-center mb-4">
          <h2 id="modalTitle" class="text-lg font-bold text-[#0F172A]">
            Add New Meeting
          </h2>
          <button
            onclick="closeModal()"
            class="text-[#64748B] hover:text-[#0F172A]"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <form
          id="meetingForm"
          onsubmit="handleFormSubmit(event)"
          class="space-y-4"
        >
          <input type="hidden" id="meetingId" />
          <div>
            <label
              class="block text-xs font-bold text-[#64748B] uppercase tracking-wider mb-1.5"
              >Meeting Title</label
            >
            <input
              type="text"
              id="meetingTitleInput"
              required
              placeholder="e.g. Live Q&A Session #1"
              class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488]"
            />
          </div>
          <div>
            <label
              class="block text-xs font-bold text-[#64748B] uppercase tracking-wider mb-1.5"
              >Meeting URL (Zoom / Platform Link)</label
            >
            <input
              type="text"
              id="meetingUrlInput"
              required
              placeholder="e.g. https://zoom.us/j/..."
              class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488]"
            />
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label
                class="block text-xs font-bold text-[#64748B] uppercase tracking-wider mb-1.5"
                >Meeting Date</label
              >
              <input
                type="date"
                id="meetingDateInput"
                required
                class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488]"
              />
            </div>
            <div>
              <label
                class="block text-xs font-bold text-[#64748B] uppercase tracking-wider mb-1.5"
                >Hours / Time</label
              >
              <input
                type="text"
                id="meetingHoursInput"
                required
                placeholder="e.g. 06:00 PM - 08:00 PM"
                class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488]"
              />
            </div>
          </div>
          <div class="flex items-center justify-end gap-3 pt-2">
            <button
              type="button"
              onclick="closeModal()"
              class="px-4 py-2 text-sm font-semibold text-[#64748B] hover:bg-slate-100 rounded-xl transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              id="saveBtn"
              class="px-5 py-2.5 bg-[#0D9488] hover:bg-[#059669] text-white text-sm font-semibold rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2 min-w-[120px]"
            >
              <span id="saveBtnText">Save Meeting</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div
      id="deleteModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white rounded-2xl p-6 sm:p-8 max-w-sm w-full shadow-xl border border-[#E2E8F0] text-center"
      >
        <div
          class="w-12 h-12 bg-[#FEF2F2] text-[#B91C1C] rounded-full flex items-center justify-center mx-auto mb-4"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>
        <h2 class="text-lg font-bold text-[#0F172A] mb-2">Delete Meeting</h2>
        <p class="text-sm text-[#64748B] mb-6">
          Are you sure you want to delete this meeting? This action cannot be
          undone.
        </p>
        <input type="hidden" id="deleteMeetingId" />
        <div class="flex items-center justify-center gap-3">
          <button
            type="button"
            onclick="closeDeleteModal()"
            class="flex-1 px-4 py-2.5 text-sm font-semibold text-[#64748B] hover:bg-slate-100 rounded-xl transition-colors border border-[#E2E8F0]"
          >
            Cancel
          </button>
          <button
            type="button"
            id="confirmDeleteBtn"
            onclick="confirmDeleteMeeting()"
            class="flex-1 px-4 py-2.5 bg-[#B91C1C] hover:bg-[#991B1B] text-white text-sm font-semibold rounded-xl transition-colors shadow-sm"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <!-- Inline Status Toast (Instead of Alerts) -->
    <div
      id="statusToast"
      class="fixed bottom-5 right-5 z-50 hidden px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white transition-all transform duration-300"
    ></div>

    <!-- Unauthorized Access Modal -->
    <div
      id="unauthorizedModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50"
    >
      <div
        class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-xl text-center border border-[#E2E8F0]"
      >
        <div
          class="w-12 h-12 bg-[#FEF2F2] text-[#B91C1C] rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-xl"
        >
          !
        </div>
        <h2 class="text-lg font-bold text-[#0F172A] mb-2">
          Unauthorized Access
        </h2>
        <p class="text-sm text-[#64748B] mb-6">
          You do not have administrative privileges to view this page.
        </p>
        <button
          onclick="window.location.href = 'dashboard.html'"
          class="w-full py-2.5 bg-[#0F172A] hover:bg-slate-800 text-white font-semibold rounded-xl text-sm transition-colors"
        >
          Go to User Dashboard
        </button>
      </div>
    </div>

    <script>
      let allMeetings = [];
      let currentWeekStartDate = getSunday(new Date());

      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.full_name) {
        window.location.href = "index.html";
      } else if (!user.is_admin) {
        document.getElementById("unauthorizedModal").classList.remove("hidden");
        document.getElementById("unauthorizedModal").classList.add("flex");
      } else {
        fetchMeetings();
      }

      // Load Sidebar component dynamically
      fetch("adminsidebar.html")
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById("sidebarContainer");
          container.innerHTML = html;
          const scripts = container.querySelectorAll("script");
          scripts.forEach((script) => {
            const newScript = document.createElement("script");
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
          if (typeof renderSidebar === "function") {
            renderSidebar("Manage Meetings");
          }
        });

      function getSunday(d) {
        d = new Date(d);
        const day = d.getDay();
        const diff = d.getDate() - day; // Adjust to Sunday
        return new Date(d.setDate(diff));
      }

      function changeWeek(direction) {
        currentWeekStartDate.setDate(
          currentWeekStartDate.getDate() + direction * 7,
        );
        renderWeeklyGrid();
      }

      function goToCurrentWeek() {
        currentWeekStartDate = getSunday(new Date());
        renderWeeklyGrid();
      }

      async function fetchMeetings() {
        try {
          const res = await fetch("/api/meetings");
          allMeetings = await res.json();
          renderWeeklyGrid();
        } catch (err) {
          console.error("Failed to load meetings", err);
          showToast("Failed to load meetings.", "error");
        }
      }

      function renderWeeklyGrid() {
        const container = document.getElementById("weeklyGridContainer");
        container.innerHTML = "";

        // Calculate week range dates (Sunday to Saturday) safely using local YYYY-MM-DD components
        const weekDays = [];
        let tempDate = new Date(currentWeekStartDate);
        for (let i = 0; i < 7; i++) {
          weekDays.push(new Date(tempDate));
          tempDate.setDate(tempDate.getDate() + 1);
        }

        // Header label
        const startStr = weekDays[0].toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        const endStr = weekDays[6].toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
        });
        document.getElementById("currentWeekLabel").textContent =
          `${startStr} — ${endStr}`;

        const dayNames = [
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday",
        ];

        weekDays.forEach((dateObj, index) => {
          const year = dateObj.getFullYear();
          const month = String(dateObj.getMonth() + 1).padStart(2, "0");
          const day = String(dateObj.getDate()).padStart(2, "0");
          const dateString = `${year}-${month}-${day}`;

          const formattedHeaderDate = dateObj.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
          });

          // Filter meetings safely matching the exact YYYY-MM-DD string
          const dayMeetings = allMeetings.filter((m) => {
            return m.meeting_date === dateString;
          });

          const colDiv = document.createElement("div");
          colDiv.className = "flex flex-col bg-white min-h-[450px]";

          let meetingsHtml = "";
          if (dayMeetings.length === 0) {
            meetingsHtml = `
              <div class="flex-1 flex items-center justify-center p-4 text-xs text-[#64748B] italic">
                No meetings scheduled
              </div>
            `;
          } else {
            meetingsHtml =
              `<div class="p-3 space-y-3 flex-1">` +
              dayMeetings
                .map(
                  (m) => `
              <div class="bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl p-3 shadow-xs hover:border-[#0D9488] transition-colors relative group">
                <div class="flex justify-between items-start gap-2 mb-1.5">
                  <h4 class="font-semibold text-xs text-[#0F172A] leading-snug">${m.title}</h4>
                  <div class="flex items-center gap-1 shrink-0">
                    <button
                      onclick='openEditModal(${m.id}, ${JSON.stringify(m.title)}, ${JSON.stringify(m.url)}, ${JSON.stringify(m.meeting_date)}, ${JSON.stringify(m.hours)})'
                      class="p-1 text-[#64748B] hover:text-[#0D9488] transition-colors"
                      title="Edit"
                    >
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                      </svg>
                    </button>
                    <button
                      onclick="openDeleteModal(${m.id})"
                      class="p-1 text-[#64748B] hover:text-[#B91C1C] transition-colors"
                      title="Delete"
                    >
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                      </svg>
                    </button>
                  </div>
                </div>
                <div class="text-[11px] font-medium text-[#0D9488] mb-1 flex items-center gap-1">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                  </svg>
                  ${m.hours}
                </div>
                <a href="${m.url}" target="_blank" class="text-[11px] text-[#64748B] hover:text-[#0D9488] underline block truncate">
                  ${m.url}
                </a>
              </div>
            `,
                )
                .join("") +
              `</div>`;
          }

          colDiv.innerHTML = `
            <div class="bg-[#F8FAFC] p-3 border-b border-[#E2E8F0] text-center">
              <div class="text-xs font-bold text-[#64748B] uppercase tracking-wider">${dayNames[index]}</div>
              <div class="text-sm font-bold text-[#0F172A]">${formattedHeaderDate}</div>
            </div>
            ${meetingsHtml}
            <div class="p-3 border-t border-[#E2E8F0] bg-white">
              <button
                onclick="openAddModalForDate('${dateString}')"
                class="w-full py-1.5 border border-dashed border-[#E2E8F0] hover:border-[#0D9488] text-[#64748B] hover:text-[#0D9488] text-xs font-semibold rounded-xl transition-colors flex items-center justify-center gap-1"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Add
              </button>
            </div>
          `;

          container.appendChild(colDiv);
        });
      }

      function openAddModal() {
        document.getElementById("modalTitle").textContent = "Add New Meeting";
        document.getElementById("meetingId").value = "";
        document.getElementById("meetingTitleInput").value = "";
        document.getElementById("meetingUrlInput").value = "";

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");
        document.getElementById("meetingDateInput").value =
          `${yyyy}-${mm}-${dd}`;

        document.getElementById("meetingHoursInput").value = "";
        document.getElementById("meetingModal").classList.remove("hidden");
        document.getElementById("meetingModal").classList.add("flex");
      }

      function openAddModalForDate(dateStr) {
        openAddModal();
        document.getElementById("meetingDateInput").value = dateStr;
      }

      function openEditModal(id, title, url, date, hours) {
        document.getElementById("modalTitle").textContent = "Edit Meeting";
        document.getElementById("meetingId").value = id;
        document.getElementById("meetingTitleInput").value = title;
        document.getElementById("meetingUrlInput").value = url;
        document.getElementById("meetingDateInput").value = date;
        document.getElementById("meetingHoursInput").value = hours;
        document.getElementById("meetingModal").classList.remove("hidden");
        document.getElementById("meetingModal").classList.add("flex");
      }

      function closeModal() {
        document.getElementById("meetingModal").classList.remove("flex");
        document.getElementById("meetingModal").classList.add("hidden");
      }

      function openDeleteModal(id) {
        document.getElementById("deleteMeetingId").value = id;
        document.getElementById("deleteModal").classList.remove("hidden");
        document.getElementById("deleteModal").classList.add("flex");
      }

      function closeDeleteModal() {
        document.getElementById("deleteModal").classList.remove("flex");
        document.getElementById("deleteModal").classList.add("hidden");
      }

      async function confirmDeleteMeeting() {
        const id = document.getElementById("deleteMeetingId").value;
        if (!id) return;

        const confirmBtn = document.getElementById("confirmDeleteBtn");
        confirmBtn.disabled = true;
        confirmBtn.textContent = "Deleting...";

        try {
          const res = await fetch(`/api/meetings?id=${id}`, {
            method: "DELETE",
          });

          if (res.ok) {
            closeDeleteModal();
            await fetchMeetings(); // Auto updates grid without a full browser reload
            showToast("Meeting deleted successfully.", "success");
          } else {
            showToast("Failed to delete meeting.", "error");
          }
        } catch (err) {
          console.error("Error deleting meeting:", err);
          showToast("An error occurred.", "error");
        } finally {
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Delete";
        }
      }

      async function handleFormSubmit(event) {
        event.preventDefault();
        const id = document.getElementById("meetingId").value;
        const title = document.getElementById("meetingTitleInput").value;
        const url = document.getElementById("meetingUrlInput").value;
        const meeting_date = document.getElementById("meetingDateInput").value;
        const hours = document.getElementById("meetingHoursInput").value;

        const saveBtn = document.getElementById("saveBtn");
        const saveBtnText = document.getElementById("saveBtnText");

        saveBtn.disabled = true;
        saveBtnText.innerHTML = `
          <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Saving...
        `;

        const method = id ? "PUT" : "POST";
        const bodyData = id
          ? { id, title, url, meeting_date, hours }
          : { title, url, meeting_date, hours };

        try {
          const res = await fetch("/api/meetings", {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bodyData),
          });

          if (res.ok) {
            closeModal();
            await fetchMeetings(); // Auto updates grid state and re-renders UI instantly
            showToast(
              id
                ? "Meeting updated successfully!"
                : "Meeting created successfully!",
              "success",
            );
          } else {
            showToast("Failed to save meeting.", "error");
          }
        } catch (err) {
          console.error("Error saving meeting:", err);
          showToast("An error occurred.", "error");
        } finally {
          saveBtn.disabled = false;
          saveBtnText.textContent = "Save Meeting";
        }
      }

      function showToast(message, type = "success") {
        const toast = document.getElementById("statusToast");
        toast.textContent = message;
        toast.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white transition-all transform duration-300 ${
          type === "success" ? "bg-[#0D9488]" : "bg-[#B91C1C]"
        }`;
        toast.classList.remove("hidden");
        setTimeout(() => {
          toast.classList.add("hidden");
        }, 3000);
      }
    </script>
  </body>
</html>
