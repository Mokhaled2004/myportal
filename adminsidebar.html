<!-- adminsidebar.html (Admin Sidebar) -->

<!-- ── Desktop sidebar (hidden on mobile, shown md+) ──────────── -->
<div
  id="desktopSidebar"
  class="hidden md:flex w-64 bg-white text-[#0F172A] flex-col p-4 justify-between h-[calc(100vh-2rem)] my-4 ml-4 rounded-2xl shadow-sm border border-[#E2E8F0] sticky top-4"
>
  <div>
    <div class="text-center mb-6 px-2">
      <h2
        class="text-2xl font-bold tracking-tight text-[#0F172A]"
        style="font-family: &quot;Urbanist&quot;, sans-serif"
      >
        MyPortal
        <span
          class="text-xs px-2 py-0.5 bg-[#0D9488] text-white rounded-full font-medium uppercase tracking-wider align-middle ml-1"
          >Admin</span
        >
      </h2>
      <div class="w-12 h-0.5 bg-[#0D9488] mx-auto mt-2 rounded-full"></div>
    </div>
    <nav
      id="sidebarNav"
      class="space-y-2 pt-2 overflow-y-auto max-h-[calc(100vh-20rem)] pr-1"
    >
      <!-- Populated dynamically -->
    </nav>
  </div>
  <div class="space-y-3 pt-4 border-t border-[#E2E8F0]">
    <a
      href="profile.html"
      id="loggedInUserDisplay"
      class="flex items-center gap-3 px-2 py-1.5 rounded-xl hover:bg-slate-50 transition-all cursor-pointer group"
      title="View Profile"
    ></a>
    <button
      onclick="logout()"
      class="w-full text-left px-3 py-2.5 text-sm text-[#0F172A] hover:bg-[#0F172A] hover:text-white rounded-xl transition-all duration-200 flex items-center gap-4 font-semibold group shadow-sm hover:translate-x-1"
      style="font-family: &quot;Urbanist&quot;, sans-serif"
    >
      <svg
        class="w-5 h-5 transition-transform group-hover:scale-110 flex-shrink-0"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
        />
      </svg>
      <span>Sign Out</span>
    </button>

    <!-- Powered by Pillars Footer -->
    <a
      href="https://pillar-dashboards.vercel.app/"
      target="_blank"
      rel="noopener noreferrer"
      class="flex items-center justify-center gap-1.5 pt-1 text-[10px] font-semibold text-slate-400 hover:text-[#0D9488] transition-colors"
      style="font-family: &quot;Urbanist&quot;, sans-serif"
    >
      <span>Powered by</span>
      <img
        src="pillerLogo.png"
        alt="Pillars Logo"
        class="w-4 h-4 object-contain inline-block"
      />
    </a>
  </div>
</div>

<script>
  (function () {
    // ── Inject overlay + drawer directly into <body> ──────────────

    // Overlay
    if (!document.getElementById("sidebarOverlay")) {
      var overlay = document.createElement("div");
      overlay.id = "sidebarOverlay";
      overlay.style.cssText =
        "display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9998;opacity:0;transition:opacity 0.3s ease;-webkit-tap-highlight-color:transparent;";
      overlay.addEventListener("click", function () {
        closeMobileSidebar();
      });
      overlay.addEventListener("touchend", function (e) {
        e.preventDefault();
        closeMobileSidebar();
      });
      document.body.appendChild(overlay);
    }

    // Drawer
    if (!document.getElementById("mobileSidebar")) {
      var drawer = document.createElement("div");
      drawer.id = "mobileSidebar";
      drawer.style.cssText =
        "display:none;position:fixed;top:0;left:0;height:100%;width:272px;z-index:9999;background:#fff;box-shadow:4px 0 24px rgba(0,0,0,0.12);transform:translateX(-100%);transition:transform 0.32s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column;padding:1rem;box-sizing:border-box;";
      drawer.innerHTML = `
      <div style="display:flex;flex-direction:column;min-height:100%;justify-content:space-between;">
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding:0 0.5rem;">
            <h2 style="font-family:'Urbanist',sans-serif;font-size:1.125rem;font-weight:700;color:#0F172A;margin:0;display:flex;align-items:center;gap:0.375rem;">
              MyPortal
              <span style="font-size:0.625rem;padding:2px 8px;background:#0D9488;color:#fff;border-radius:9999px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;">Admin</span>
            </h2>
            <button id="drawerCloseBtn" style="background:none;border:none;cursor:pointer;padding:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;" aria-label="Close menu">
              <svg width="22" height="22" fill="none" stroke="#0F172A" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <div style="width:3rem;height:2px;background:#0D9488;border-radius:9999px;margin:0 auto 1rem;"></div>
          <nav id="sidebarNavMobile" style="display:flex;flex-direction:column;gap:0.25rem;"></nav>
        </div>
        <div style="padding-top:1rem;margin-top:1rem;border-top:1px solid #E2E8F0;display:flex;flex-direction:column;gap:0.75rem;">
          <a href="profile.html" id="loggedInUserDisplayMobile"
            style="display:flex;align-items:center;gap:0.75rem;padding:0.375rem 0.5rem;border-radius:0.75rem;text-decoration:none;-webkit-tap-highlight-color:transparent;"></a>
          <button onclick="logout()"
            style="font-family:'Urbanist',sans-serif;width:100%;text-align:left;padding:0.625rem 0.75rem;font-size:0.875rem;color:#0F172A;border:none;background:none;border-radius:0.75rem;cursor:pointer;display:flex;align-items:center;gap:1rem;font-weight:600;touch-action:manipulation;-webkit-tap-highlight-color:transparent;">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            <span>Sign Out</span>
          </button>
          
          <!-- Mobile Powered by Pillars Footer -->
          <a href="https://pillar-dashboards.vercel.app/" target="_blank" rel="noopener noreferrer"
            style="display:flex;align-items:center;justify-content:center;gap:4px;padding-top:0.25rem;font-size:10px;font-weight:600;color:#94A3B8;text-decoration:none;font-family:Urbanist,sans-serif;">
            <span>Powered by</span>
            <img src="pillerLogo.png" alt="Pillars Logo" style="width:16px;height:16px;object-fit:contain;display:inline-block;" />
          </a>
        </div>
      </div>
    `;
      document.body.appendChild(drawer);

      document
        .getElementById("drawerCloseBtn")
        .addEventListener("click", function () {
          closeMobileSidebar();
        });
      document
        .getElementById("drawerCloseBtn")
        .addEventListener("touchend", function (e) {
          e.preventDefault();
          closeMobileSidebar();
        });
    }

    function logout() {
      localStorage.removeItem("user");
      window.location.href = "index.html";
    }

    function openMobileSidebar() {
      var drawer = document.getElementById("mobileSidebar");
      var overlay = document.getElementById("sidebarOverlay");
      drawer.style.display = "flex";
      overlay.style.display = "block";
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          drawer.style.transform = "translateX(0)";
          overlay.style.opacity = "1";
        });
      });
      document.body.style.overflow = "hidden";
      document.documentElement.style.overflow = "hidden";
    }

    function closeMobileSidebar() {
      var drawer = document.getElementById("mobileSidebar");
      var overlay = document.getElementById("sidebarOverlay");
      if (!drawer) return;
      drawer.style.transform = "translateX(-100%)";
      overlay.style.opacity = "0";
      setTimeout(function () {
        drawer.style.display = "none";
        overlay.style.display = "none";
        document.body.style.overflow = "";
        document.documentElement.style.overflow = "";
      }, 320);
    }

    function toggleDropdown(headerEl) {
      var contentEl = headerEl.nextElementSibling;
      var arrowEl = headerEl.querySelector(".dropdown-arrow");
      if (contentEl.classList.contains("hidden")) {
        contentEl.classList.remove("hidden");
        if (arrowEl) arrowEl.style.transform = "rotate(180deg)";
      } else {
        contentEl.classList.add("hidden");
        if (arrowEl) arrowEl.style.transform = "rotate(0deg)";
      }
    }

    window.openMobileSidebar = openMobileSidebar;
    window.closeMobileSidebar = closeMobileSidebar;
    window.logout = logout;
    window.toggleDropdown = toggleDropdown;

    function renderSidebar(currentActive) {
      var user = JSON.parse(localStorage.getItem("user") || "{}");

      function buildUserHtml(fullName) {
        var firstName = fullName.trim().split(" ")[0];
        var initial = firstName.charAt(0).toUpperCase();
        return (
          '<div style="width:36px;height:36px;border-radius:50%;background:#0D9488;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.875rem;flex-shrink:0;font-family:Urbanist,sans-serif;">' +
          initial +
          "</div>" +
          '<div style="overflow:hidden;flex:1;"><p style="font-size:0.75rem;color:#64748B;font-weight:500;margin:0;">Logged in as</p>' +
          '<p style="font-size:0.875rem;font-weight:700;color:#0F172A;margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Urbanist,sans-serif;">' +
          fullName.trim() +
          "</p></div>"
        );
      }

      if (user.full_name) {
        var el = document.getElementById("loggedInUserDisplay");
        if (el) el.innerHTML = buildUserHtml(user.full_name);
        var elM = document.getElementById("loggedInUserDisplayMobile");
        if (elM) elM.innerHTML = buildUserHtml(user.full_name);
      }

      var items = [
        {
          name: "Admin Dashboard",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>',
          href: "admindashboard.html",
        },
        {
          name: "Manage Users",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>',
          href: "adminusers.html",
        },
        {
          name: "Manage Schools",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>',
          href: "adminschools.html",
        },
        {
          name: "Manage Videos",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>',
          href: "adminvideos.html",
        },
        {
          name: "Manage Chapters",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>',
          href: "adminchapters.html",
        },
        {
          name: "Manage Files",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>',
          href: "adminfiles.html",
        },
        {
          name: "Manage Homework",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>',
          href: "adminhomework.html",
        },
        {
          name: "Attendance",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-6 9l2 2 4-4"/></svg>',
          href: "adminattendance.html",
        },
        {
          name: "Pastpapers",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>',
          children: [
            { name: "Manage Pastpapers", href: "adminpastpapers.html" },
            {
              name: "Pastpapers Submissions",
              href: "adminpastpaperssubmissions.html",
            },
          ],
        },
        {
          name: "Exam Grades Control",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-6 9l2 2 4-4"/></svg>',
          href: "admingrades.html",
        },
        {
          name: "Manage Meetings",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l-4.553-2.276A1 1 0 009 8.618v6.764a1 1 0 001.447.894L15 14m0-4v4m-6 2H5a2 2 0 01-2-2V8a2 2 0 012-2h4a2 2 0 012 2v8a2 2 0 01-2 2z"/></svg>',
          href: "adminmeetings.html",
        },
        {
          name: "Post Announcements",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"/></svg>',
          href: "adminannouncements.html",
        },
        {
          name: "Students Progress",
          icon: '<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>',
          href: "adminstudentsprogress.html",
        },
      ];

      function buildDesktopNav(navId) {
        var nav = document.getElementById(navId);
        if (!nav) return;
        nav.innerHTML = "";
        items.forEach(function (item) {
          if (item.children) {
            var isChildActive = item.children.some(function (c) {
              return c.name === currentActive;
            });
            var containerClass = isChildActive
              ? "rounded-xl border-2 border-[#0F172A] bg-[#F8FAFC] shadow-sm"
              : "rounded-xl border-2 border-transparent hover:bg-slate-50 transition-all duration-200";
            var childrenHtml = item.children
              .map(function (child) {
                var isCurrent = currentActive === child.name;
                var childCls = isCurrent
                  ? "flex items-center gap-3 px-3 py-2 mr-3 rounded-lg bg-[#0F172A] text-white text-xs font-bold shadow-sm"
                  : "flex items-center gap-3 px-3 py-2 mr-3 rounded-lg text-[#64748B] hover:bg-[#0F172A] hover:text-white text-xs font-semibold transition-all duration-200";
                return (
                  '<a href="' +
                  child.href +
                  '" class="' +
                  childCls +
                  '" style="font-family:Urbanist,sans-serif;"><span class="w-1.5 h-1.5 rounded-full bg-current"></span><span>' +
                  child.name +
                  "</span></a>"
                );
              })
              .join("");
            var hiddenClass = isChildActive ? "" : "hidden";
            var arrowStyle = isChildActive ? "transform:rotate(180deg);" : "";
            nav.innerHTML +=
              '<div class="' +
              containerClass +
              '"><div onclick="toggleDropdown(this)" class="flex items-center justify-between px-3 py-2.5 text-[#0F172A] text-sm font-bold group cursor-pointer" style="font-family:Urbanist,sans-serif;"><div class="flex items-center gap-4"><span>' +
              item.icon +
              "</span><span>" +
              item.name +
              '</span></div><svg class="w-4 h-4 text-[#64748B] transition-transform duration-200 dropdown-arrow" style="' +
              arrowStyle +
              '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg></div><div class="pl-4 pb-2 space-y-1 border-l-2 border-[#E2E8F0] ml-7 ' +
              hiddenClass +
              '">' +
              childrenHtml +
              "</div></div>";
          } else {
            var isActive = currentActive === item.name;
            var cls = isActive
              ? "flex items-center gap-4 px-3 py-2.5 rounded-xl border-2 border-[#0F172A] text-[#0F172A] text-sm font-bold shadow-sm transition-all duration-200 group bg-[#F8FAFC]"
              : "flex items-center gap-4 px-3 py-2.5 rounded-xl border-2 border-transparent text-[#64748B] hover:bg-[#0F172A] hover:text-white text-sm font-semibold transition-all duration-200 group hover:translate-x-1";
            nav.innerHTML +=
              '<a href="' +
              item.href +
              '" class="' +
              cls +
              '" style="font-family:Urbanist,sans-serif;"><span>' +
              item.icon +
              "</span><span>" +
              item.name +
              "</span></a>";
          }
        });
      }

      function buildMobileNav(navId) {
        var nav = document.getElementById(navId);
        if (!nav) return;
        nav.innerHTML = "";
        items.forEach(function (item) {
          if (item.children) {
            var wrapper = document.createElement("div");
            wrapper.style.cssText =
              "border-radius:0.75rem;overflow:hidden;margin-bottom:2px;";

            var header = document.createElement("div");
            header.style.cssText =
              "display:flex;align-items:center;justify-content:space-between;padding:0.625rem 0.75rem;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:Urbanist,sans-serif;font-size:0.875rem;font-weight:700;color:#0F172A;";
            header.innerHTML =
              '<div style="display:flex;align-items:center;gap:0.75rem;"><span style="display:flex;">' +
              item.icon +
              "</span><span>" +
              item.name +
              "</span></div>" +
              '<svg style="width:16px;height:16px;color:#64748B;transition:transform 0.2s;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>';

            var childList = document.createElement("div");
            childList.style.cssText =
              "display:none;padding-left:1.5rem;padding-bottom:0.5rem;";

            item.children.forEach(function (child) {
              var isActive = currentActive === child.name;
              var a = document.createElement("a");
              a.href = child.href;
              a.style.cssText =
                "display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.75rem;border-radius:0.5rem;text-decoration:none;font-family:Urbanist,sans-serif;font-size:0.75rem;font-weight:" +
                (isActive ? "700" : "600") +
                ";color:" +
                (isActive ? "#fff" : "#64748B") +
                ";background:" +
                (isActive ? "#0F172A" : "transparent") +
                ";margin-bottom:2px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;";
              a.innerHTML =
                '<span style="width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;"></span><span>' +
                child.name +
                "</span>";
              childList.appendChild(a);
            });

            var arrow = header.querySelector("svg");
            header.addEventListener("click", function () {
              var isOpen = childList.style.display !== "none";
              childList.style.display = isOpen ? "none" : "block";
              if (arrow) arrow.style.transform = isOpen ? "" : "rotate(180deg)";
            });

            wrapper.appendChild(header);
            wrapper.appendChild(childList);
            nav.appendChild(wrapper);
          } else {
            var isActive = currentActive === item.name;
            var a = document.createElement("a");
            a.href = item.href;
            a.style.cssText =
              "display:flex;align-items:center;gap:1rem;padding:0.625rem 0.75rem;border-radius:0.75rem;font-family:Urbanist,sans-serif;font-size:0.875rem;font-weight:" +
              (isActive ? "700" : "600") +
              ";text-decoration:none;color:" +
              (isActive ? "#fff" : "#64748B") +
              ";background:" +
              (isActive ? "#0F172A" : "transparent") +
              ";border:2px solid " +
              (isActive ? "#0F172A" : "transparent") +
              ";touch-action:manipulation;-webkit-tap-highlight-color:transparent;margin-bottom:2px;";
            a.innerHTML =
              '<span style="display:flex;align-items:center;color:' +
              (isActive ? "#fff" : "currentColor") +
              ';">' +
              item.icon +
              "</span><span>" +
              item.name +
              "</span>";
            nav.appendChild(a);
          }
        });
      }

      buildDesktopNav("sidebarNav");
      buildMobileNav("sidebarNavMobile");
    }

    window.renderSidebar = renderSidebar;
  })();
</script>
