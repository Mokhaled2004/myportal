<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Pastpapers — Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex">
    <!-- Sidebar Container -->
    <aside
      id="sidebarContainer"
      class="hidden md:flex flex-col shrink-0 h-screen sticky top-0"
    ></aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto">    <!-- Mobile burger button (shown only on mobile) -->
    <div class="md:hidden sticky top-0 z-30 bg-white border-b border-[#E2E8F0] px-4 py-3 flex items-center gap-3 shadow-sm">
      <button
        onclick="if(typeof openMobileSidebar==='function')openMobileSidebar();"
        class="p-2 rounded-xl bg-[#F8FAFC] border border-[#E2E8F0] text-[#0F172A] hover:bg-slate-100 transition-colors flex-shrink-0"
        aria-label="Open menu"
      >
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-bold text-[#0F172A] text-base tracking-tight" style="font-family:'Urbanist',sans-serif;">MyPortal</span>
    </div>      <div class="p-6 md:p-10">
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6"
      >
        <div>
          <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
            Manage Pastpapers
          </h1>
          <p class="text-sm text-[#64748B]">
            Add, edit, and organize pastpapers with optional paper and
            markscheme links.
          </p>
        </div>
        <button
          onclick="openAddModal()"
          class="px-4 py-2.5 bg-[#0D9488] hover:bg-[#0b7a6e] text-white rounded-xl text-sm font-semibold shadow-sm transition-all flex items-center gap-2"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
          <span>Add Pastpaper</span>
        </button>
      </div>

      <!-- Search & Filters Bar -->
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl p-4 sm:p-6 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <div class="relative w-full md:w-96">
          <svg
            class="absolute left-3.5 top-3.5 w-4 h-4 text-[#64748B]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
          <input
            type="text"
            id="searchInput"
            oninput="filterPastpapers()"
            placeholder="Search pastpapers by title, month, or year..."
            class="w-full pl-10 pr-4 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488] text-[#0F172A]"
          />
        </div>
      </div>

      <!-- Pastpapers List Container -->
      <div id="pastpapersContainer" class="space-y-4">
        <!-- Populated dynamically by JS -->
      </div>
    </div>
    </main>

    <!-- Add/Edit Modal -->
    <div
      id="pastpaperModal"
      class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"
    >
      <div
        class="bg-white border border-[#E2E8F0] rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4"
      >
        <div class="flex items-center justify-between">
          <h3 id="modalTitle" class="text-lg font-bold text-[#0F172A]">
            Add New Pastpaper
          </h3>
          <button
            onclick="closeModal()"
            class="text-[#64748B] hover:text-[#0F172A]"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <form
          id="pastpaperForm"
          onsubmit="handleFormSubmit(event)"
          class="space-y-4"
        >
          <input type="hidden" id="pastpaperId" />

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                class="block text-xs font-semibold text-[#64748B] uppercase tracking-wider mb-1.5"
                >Month</label
              >
              <select
                id="pastpaperMonth"
                required
                class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm font-medium text-[#0F172A] focus:outline-none focus:border-[#0D9488]"
              >
                <option value="jan">Jan</option>
                <option value="june">June</option>
                <option value="oct">Oct</option>
              </select>
            </div>
            <div>
              <label
                class="block text-xs font-semibold text-[#64748B] uppercase tracking-wider mb-1.5"
                >Year</label
              >
              <input
                type="number"
                id="pastpaperYear"
                required
                placeholder="e.g. 2022"
                class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488] text-[#0F172A]"
              />
            </div>
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-[#64748B] uppercase tracking-wider mb-1.5"
              >Paper URL (Optional)</label
            >
            <input
              type="url"
              id="pastpaperUrl"
              placeholder="https://example.com/paper.pdf"
              class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488] text-[#0F172A]"
            />
          </div>

          <div>
            <label
              class="block text-xs font-semibold text-[#64748B] uppercase tracking-wider mb-1.5"
              >Markscheme URL (Optional)</label
            >
            <input
              type="url"
              id="pastpaperMarkscheme"
              placeholder="https://example.com/markscheme.pdf"
              class="w-full px-3.5 py-2.5 bg-[#F8FAFC] border border-[#E2E8F0] rounded-xl text-sm focus:outline-none focus:border-[#0D9488] text-[#0F172A]"
            />
          </div>

          <div
            class="flex items-center justify-end gap-3 pt-4 border-t border-[#E2E8F0]"
          >
            <button
              type="button"
              onclick="closeModal()"
              class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-sm font-semibold transition-colors"
            >
              Cancel
            </button>
            <button
              type="submit"
              id="saveButton"
              class="px-4 py-2 bg-[#0D9488] hover:bg-[#0b7a6e] text-white rounded-xl text-sm font-semibold shadow-sm transition-all flex items-center gap-2"
            >
              <span>Save Pastpaper</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div
      id="deleteModal"
      class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4"
    >
      <div
        class="bg-white rounded-2xl p-6 sm:p-8 max-w-sm w-full shadow-xl border border-[#E2E8F0] text-center"
      >
        <div
          class="w-12 h-12 bg-[#FEF2F2] text-[#B91C1C] rounded-full flex items-center justify-center mx-auto mb-4"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>
        <h2 class="text-lg font-bold text-[#0F172A] mb-2">Delete Pastpaper</h2>
        <p class="text-sm text-[#64748B] mb-6">
          Are you sure you want to delete this pastpaper? This action cannot be
          undone.
        </p>
        <input type="hidden" id="deletePastpaperId" />
        <div class="flex items-center justify-center gap-3">
          <button
            type="button"
            onclick="closeDeleteModal()"
            class="flex-1 px-4 py-2.5 text-sm font-semibold text-[#64748B] hover:bg-slate-100 rounded-xl transition-colors border border-[#E2E8F0]"
          >
            Cancel
          </button>
          <button
            type="button"
            id="confirmDeleteBtn"
            onclick="confirmDeletePastpaper()"
            class="flex-1 px-4 py-2.5 bg-[#B91C1C] hover:bg-[#991B1B] text-white text-sm font-semibold rounded-xl transition-colors shadow-sm"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <!-- Inline Status Toast (Instead of Alerts) -->
    <div
      id="statusToast"
      class="fixed bottom-5 right-5 z-50 hidden px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white transition-all transform duration-300"
    ></div>

    <script>
      let allPastpapers = [];

      // Check authentication
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      if (!user.full_name) {
        window.location.href = "index.html";
      } else {
        init();
      }

      // Load Sidebar component dynamically
      fetch("adminsidebar.html")
        .then((res) => res.text())
        .then((html) => {
          const container = document.getElementById("sidebarContainer");
          container.innerHTML = html;
          const scripts = container.querySelectorAll("script");
          scripts.forEach((script) => {
            const newScript = document.createElement("script");
            newScript.textContent = script.textContent;
            document.body.appendChild(newScript);
          });
          if (typeof renderSidebar === "function") {
            renderSidebar("Manage Pastpapers");
          }
        });

      async function init() {
        await fetchPastpapers();
      }

      async function fetchPastpapers() {
        const container = document.getElementById("pastpapersContainer");
        container.innerHTML = `
          <div class="py-20 flex flex-col items-center justify-center gap-3">
            <div class="w-8 h-8 border-4 border-[#0D9488] border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm font-medium text-[#64748B]">Loading pastpapers...</p>
          </div>
        `;

        try {
          const res = await fetch("/api/pastpapers");
          allPastpapers = await res.json();
          filterPastpapers();
        } catch (err) {
          console.error("Failed to load pastpapers", err);
          container.innerHTML = `
            <div class="p-12 text-center bg-white border border-[#E2E8F0] rounded-2xl text-[#B91C1C]">
              Failed to load pastpapers. Please refresh the page.
            </div>
          `;
        }
      }

      function filterPastpapers() {
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        let filtered = allPastpapers.filter((item) => {
          return (
            (item.title && item.title.toLowerCase().includes(query)) ||
            (item.month && item.month.toLowerCase().includes(query)) ||
            (item.year && item.year.toString().includes(query))
          );
        });

        renderPastpapers(filtered);
      }

      function renderPastpapers(items) {
        const container = document.getElementById("pastpapersContainer");

        if (!items || items.length === 0) {
          container.innerHTML = `
            <div class="bg-white border border-[#E2E8F0] rounded-2xl p-12 text-center shadow-sm">
              <p class="text-sm font-medium text-[#64748B]">No pastpapers found.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = items
          .map((item) => {
            const paperLink = item.paper
              ? `<a href="${item.paper}" target="_blank" class="px-3 py-1.5 bg-teal-50 text-teal-700 hover:bg-teal-100 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>View Paper</a>`
              : `<span class="text-xs text-[#64748B] italic">No Paper URL</span>`;

            const markschemeLink = item.markscheme
              ? `<a href="${item.markscheme}" target="_blank" class="px-3 py-1.5 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-lg text-xs font-semibold transition-colors flex items-center gap-1"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>View Markscheme</a>`
              : `<span class="text-xs text-[#64748B] italic">No Markscheme URL</span>`;

            return `
            <div class="bg-white border border-[#E2E8F0] rounded-2xl p-6 shadow-sm hover:shadow-md transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-teal-50 text-[#0D9488] flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                  </svg>
                </div>
                <div>
                  <h3 class="text-base font-bold text-[#0F172A]">${item.title}</h3>
                  <div class="flex items-center gap-3 mt-1">
                    ${paperLink}
                    ${markschemeLink}
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-2 self-end sm:self-center">
                <button onclick="openEditModal(${item.id}, '${item.month}', ${item.year}, '${item.paper || ""}', '${item.markscheme || ""}')" class="p-2 text-[#64748B] hover:text-[#0D9488] hover:bg-slate-50 rounded-lg transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button onclick="openDeleteModal(${item.id})" class="p-2 text-[#64748B] hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            </div>
          `;
          })
          .join("");
      }

      function openAddModal() {
        document.getElementById("modalTitle").innerText = "Add New Pastpaper";
        document.getElementById("pastpaperId").value = "";
        document.getElementById("pastpaperMonth").value = "jan";
        document.getElementById("pastpaperYear").value = "";
        document.getElementById("pastpaperUrl").value = "";
        document.getElementById("pastpaperMarkscheme").value = "";
        document.getElementById("pastpaperModal").classList.remove("hidden");
      }

      function openEditModal(id, month, year, paper, markscheme) {
        document.getElementById("modalTitle").innerText = "Edit Pastpaper";
        document.getElementById("pastpaperId").value = id;
        document.getElementById("pastpaperMonth").value = month;
        document.getElementById("pastpaperYear").value = year;
        document.getElementById("pastpaperUrl").value =
          paper === "null" ? "" : paper;
        document.getElementById("pastpaperMarkscheme").value =
          markscheme === "null" ? "" : markscheme;
        document.getElementById("pastpaperModal").classList.remove("hidden");
      }

      function closeModal() {
        document.getElementById("pastpaperModal").classList.add("hidden");
      }

      function openDeleteModal(id) {
        document.getElementById("deletePastpaperId").value = id;
        document.getElementById("deleteModal").classList.remove("hidden");
        document.getElementById("deleteModal").classList.add("flex");
      }

      function closeDeleteModal() {
        document.getElementById("deleteModal").classList.remove("flex");
        document.getElementById("deleteModal").classList.add("hidden");
      }

      async function confirmDeletePastpaper() {
        const id = document.getElementById("deletePastpaperId").value;
        if (!id) return;

        const confirmBtn = document.getElementById("confirmDeleteBtn");
        confirmBtn.disabled = true;
        confirmBtn.textContent = "Deleting...";

        try {
          const res = await fetch(`/api/pastpapers?id=${id}`, {
            method: "DELETE",
          });

          if (!res.ok) throw new Error("Failed to delete pastpaper");

          closeDeleteModal();
          await fetchPastpapers();
          showToast("Pastpaper deleted successfully.", "success");
        } catch (err) {
          console.error(err);
          showToast("Error deleting pastpaper", "error");
        } finally {
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Delete";
        }
      }

      async function handleFormSubmit(event) {
        event.preventDefault();
        const saveButton = document.getElementById("saveButton");
        const originalButtonHtml = saveButton.innerHTML;

        // Display saving state with a spinner icon
        saveButton.disabled = true;
        saveButton.innerHTML = `
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Saving...</span>
        `;

        const id = document.getElementById("pastpaperId").value;
        const month = document.getElementById("pastpaperMonth").value;
        const year = document.getElementById("pastpaperYear").value;
        const paper = document.getElementById("pastpaperUrl").value;
        const markscheme = document.getElementById("pastpaperMarkscheme").value;

        // Auto-save title format e.g. jan-2022
        const title = `${month}-${year}`;

        const method = id ? "PUT" : "POST";
        const bodyData = {
          id,
          month,
          year: parseInt(year),
          title,
          paper,
          markscheme,
        };

        try {
          const res = await fetch("/api/pastpapers", {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(bodyData),
          });

          if (!res.ok) throw new Error("Failed to save pastpaper");

          // Refresh the page on successful save
          window.location.reload();
        } catch (err) {
          console.error(err);
          showToast("Error saving pastpaper", "error");
          saveButton.disabled = false;
          saveButton.innerHTML = originalButtonHtml;
        }
      }

      function showToast(message, type = "success") {
        const toast = document.getElementById("statusToast");
        toast.textContent = message;
        toast.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white transition-all transform duration-300 ${
          type === "success" ? "bg-[#0D9488]" : "bg-[#B91C1C]"
        }`;
        toast.classList.remove("hidden");
        setTimeout(() => {
          toast.classList.add("hidden");
        }, 3000);
      }
    </script>
  </body>
</html>
