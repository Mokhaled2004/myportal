<!-- adminsignup.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal — Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-[#F8FAFC] text-[#0F172A] font-sans min-h-screen flex items-center justify-center"
  >
    <div
      class="w-full max-w-md p-6 bg-white border border-[#E2E8F0] rounded-2xl shadow-sm"
    >
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-[#0F172A]">
          Admin Registration
        </h1>
        <p class="text-sm text-[#64748B] mt-1">
          Create a new administrative account
        </p>
      </div>

      <div
        id="alertBox"
        class="hidden mb-4 p-3 text-sm rounded-lg border"
      ></div>

      <form
        id="adminSignupForm"
        onsubmit="handleAdminSignup(event)"
        class="space-y-4"
      >
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-[#64748B] mb-1"
            >Full Name</label
          >
          <input
            type="text"
            id="adminFullName"
            required
            class="w-full px-3 py-2 text-sm border border-[#E2E8F0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0D9488] bg-white text-[#0F172A]"
          />
        </div>
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-[#64748B] mb-1"
            >Password</label
          >
          <input
            type="password"
            id="adminPassword"
            required
            class="w-full px-3 py-2 text-sm border border-[#E2E8F0] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#0D9488] bg-white text-[#0F172A]"
          />
        </div>
        <button
          type="submit"
          id="adminSignupBtn"
          class="w-full py-2.5 bg-[#0D9488] hover:bg-teal-700 text-white font-semibold rounded-lg text-sm transition-colors shadow-sm flex items-center justify-center"
        >
          <span>Create Admin Account</span>
        </button>
      </form>

      <div class="mt-4 text-center">
        <a
          href="index.html"
          class="text-xs text-[#64748B] hover:text-[#0F172A] underline"
          >Back to Student Portal</a
        >
      </div>
    </div>

    <script>
      function showAlert(msg, isError = true) {
        const box = document.getElementById("alertBox");
        box.textContent = msg;
        box.className = `mb-4 p-3 text-sm rounded-lg border ${isError ? "bg-[#FEF2F2] text-[#B91C1C] border-[#F3C7C0]" : "bg-[#ECFDF5] text-[#047857] border-[#A7F3D0]"}`;
        box.classList.remove("hidden");
      }

      async function handleAdminSignup(e) {
        e.preventDefault();
        const btn = document.getElementById("adminSignupBtn");
        const originalText = btn.innerHTML;

        btn.disabled = true;
        btn.innerHTML = `Creating admin account...`;

        const full_name = document.getElementById("adminFullName").value.trim();
        const password = document.getElementById("adminPassword").value;

        try {
          const res = await fetch("/api/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              full_name,
              school_name: "",
              password,
              account_type: "admin",
            }),
          });
          const data = await res.json();
          if (data.success) {
            showAlert(
              "Admin account created successfully! Redirecting...",
              false,
            );
            localStorage.setItem("user", JSON.stringify(data.user));
            setTimeout(() => {
              window.location.href = "admindashboard.html";
            }, 600);
          } else {
            showAlert(data.error);
            btn.disabled = false;
            btn.innerHTML = originalText;
          }
        } catch (err) {
          showAlert("Connection error to server.");
          btn.disabled = false;
          btn.innerHTML = originalText;
        }
      }
    </script>
  </body>
</html>
